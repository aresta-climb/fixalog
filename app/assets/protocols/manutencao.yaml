protocolo:
  id: manutencao
  nome: "Manutenção de Proteções Fixas"
  descricao: "Protocolo para manutenção e instalação de proteções fixas (parabolts, chapeletas, argolas, ancoragens, limpeza e blocos soltos)"
  versao: 2

  blocos:

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 1 — Identificação da via
    # ═══════════════════════════════════════════════════════════════
    - id: via
      titulo: "Bloco 1 — Identificação da Via"
      subtitulo: "Dados de data, localização e identificação da via manutenida"

      steps:
        - id: via_localizacao
          conteudos:
            - id: via_aviso
              instrucao:
                titulo: "Identificação da Via"
                corpo: "Preencha os dados de localização e data da manutenção. A coordenada GPS é obrigatória."
                nivel_alerta: INFO
            - id: via_data
              campo_simples:
                label: "Data da Manutenção"
                sublabel: "Preenchida automaticamente com a data atual (editável)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true
            - id: via_gps
              campo_simples:
                label: "Localização GPS"
                tipo: GPS
                obrigatorio: true
            - id: via_nome
              campo_simples:
                label: "Nome da via"
                tipo: TEXT
                obrigatorio: true
            - id: via_setor
              campo_simples:
                label: "Setor / Bloco"
                tipo: TEXT
            - id: via_pico
              campo_simples:
                label: "Pico / Área"
                tipo: TEXT

        - id: via_permissao
          conteudos:
            - id: via_tem_permissao
              campo_simples:
                label: "Possui permissão do conquistador?"
                tipo: BOOLEAN
                obrigatorio: true
            - id: via_foto_permissao
              campo_simples:
                label: "Mídia da permissão (se houver)"
                tipo: IMAGE
                ui_hint: CAMERA_ACTION

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 2 — Ações de manutenção
    # ═══════════════════════════════════════════════════════════════
    - id: acoes
      titulo: "Bloco 2 — Ações de Manutenção"
      subtitulo: "Registre cada ação realizada nesta via. Mínimo 1."

      steps:
        - id: lista_acoes
          conteudos:
            - id: lista_acoes_c
              lista_acoes:
                label: "Ações realizadas"
                sublabel: "Adicione cada ação de manutenção. Mínimo 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:

                  # ── Inspeção de Ancoragem (multi-conteúdo + branching) ──
                  - id: inspecao_ancoragem
                    label: "Inspeção de Ancoragem"
                    sublabel: "Avaliação do estado de uma ancoragem existente"
                    icon_name: search
                    steps:
                      - id: ia_avaliacao
                        conteudos:
                          - id: ia_instrucao
                            instrucao:
                              titulo: "Avaliação Visual e Mecânica"
                              corpo: "Registre o estado atual antes de qualquer intervenção. Em seguida, avalie visualmente (corrosão, trincas) e mecanicamente (reaperto). Classifique o resultado."
                              nivel_alerta: ATENCAO
                          - id: ia_foto_antes
                            campo_simples:
                              label: "Mídia antes da intervenção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                          - id: ia_resultado
                            selecao_ramo:
                              label: "Resultado da avaliação"
                              obrigatorio: true
                              ramos:
                                - id: aprovado
                                  label: "Aprovado — Sem intervenção"
                                  sublabel: "Ancoragem em bom estado"
                                  icon_name: check_circle
                                  steps:
                                    - id: ia_ap_detalhe
                                      conteudos:
                                        - id: ia_ap_nota
                                          campo_simples:
                                            label: "Observações"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA

                                - id: reaperto
                                  label: "Reaperto realizado"
                                  sublabel: "Ancoragem reaperta com torquímetro"
                                  icon_name: build
                                  steps:
                                    - id: ia_re_detalhe
                                      conteudos:
                                        - id: ia_re_torque
                                          campo_simples:
                                            label: "Torque aplicado (Nm)"
                                            tipo: NUMBER
                                        - id: ia_re_nota
                                          campo_simples:
                                            label: "Observações"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA

                                - id: substituir
                                  label: "Substituição necessária"
                                  sublabel: "Ancoragem com dano estrutural"
                                  icon_name: swap_horiz
                                  steps:
                                    - id: ia_sub_estrategia
                                      conteudos:
                                        - id: ia_sub_aviso
                                          instrucao:
                                            titulo: "Estratégia de Substituição"
                                            corpo: "Se o furo puder ser reutilizado, use ancoragem química. Caso contrário, perfure novo local."
                                            nivel_alerta: PERIGO
                                        - id: ia_sub_ramo
                                          selecao_ramo:
                                            label: "Como será feita a substituição?"
                                            obrigatorio: true
                                            ramos:
                                              - id: reusar_furo
                                                label: "Reutilizar furo existente"
                                                sublabel: "Com ancoragem química"
                                                icon_name: refresh
                                                steps:
                                                  - id: ia_sub_rf_dados
                                                    conteudos:
                                                      - id: ref_mat_reusar_furo
                                                        ref_materiais:
                                                          label: "Materiais utilizados"
                                                          sublabel: "Selecione os materiais do catálogo instalados nesta ancoragem ou cadastre um novo"
                                                          origem_catalogo: true
                                                          obrigatorio: true
                                                      - id: ia_sub_rf_foto
                                                        campo_simples:
                                                          label: "Mídia após instalação"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true

                                              - id: novo_local
                                                label: "Novo local de perfuração"
                                                sublabel: "Perfuração em posição diferente"
                                                icon_name: gps_fixed
                                                steps:
                                                  - id: ia_sub_nl_dados
                                                    conteudos:
                                                      - id: ref_mat_novo_local
                                                        ref_materiais:
                                                          label: "Materiais utilizados"
                                                          sublabel: "Selecione os materiais do catálogo instalados nesta ancoragem ou cadastre um novo"
                                                          origem_catalogo: true
                                                          obrigatorio: true
                                                      - id: ia_sub_nl_nota
                                                        campo_simples:
                                                          label: "Justificativa do novo local"
                                                          tipo: TEXT
                                                          ui_hint: TEXT_AREA
                                                      - id: ia_sub_nl_foto
                                                        campo_simples:
                                                          label: "Mídia após instalação"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true

                  # ── Novo Ponto de Ancoragem ───────────────────────
                  - id: novo_ponto
                    label: "Novo Ponto de Ancoragem"
                    sublabel: "Instalação de nova ancoragem"
                    icon_name: add_location
                    steps:
                      - id: np_dados
                        conteudos:
                          - id: np_instrucao
                            instrucao:
                              titulo: "Novo ponto de ancoragem"
                              corpo: "Selecione os materiais instalados do seu catálogo local e registre mídias após a instalação."
                              nivel_alerta: INFO
                          - id: ref_mat_novo_ponto
                            ref_materiais:
                              label: "Materiais utilizados"
                              sublabel: "Selecione os materiais do catálogo instalados neste ponto ou cadastre um novo"
                              origem_catalogo: true
                              obrigatorio: true
                          - id: np_foto
                            campo_simples:
                              label: "Mídia após instalação"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true

                  # ── Remoção de Bloco Solto ────────────────────────
                  - id: remocao_bloco
                    label: "Remoção de Bloco Solto"
                    sublabel: "Retirada de pedra instável"
                    icon_name: delete_forever
                    steps:
                      - id: rb_dados
                        conteudos:
                          - id: rb_aviso
                            instrucao:
                              titulo: "ATENÇÃO — Zona de Risco"
                              corpo: "A remoção de blocos deve ser feita com a via interditada e sem presença de pessoas abaixo."
                              nivel_alerta: PERIGO
                          - id: rb_tamanho
                            campo_simples:
                              label: "Tamanho aproximado do bloco"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: pequeno
                                  label: "Pequeno (tamanho de punho)"
                                - valor: medio
                                  label: "Médio (tamanho de melancia)"
                                - valor: grande
                                  label: "Grande (maior que melancia)"
                          - id: rb_foto_antes
                            campo_simples:
                              label: "Mídia antes da remoção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: rb_foto_depois
                            campo_simples:
                              label: "Mídia após remoção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Limpeza de Vegetação ──────────────────────────
                  - id: limpeza_vegetacao
                    label: "Limpeza de Vegetação"
                    sublabel: "Retirada de plantas na via"
                    icon_name: grass
                    steps:
                      - id: lv_dados
                        conteudos:
                          - id: lv_foto_antes
                            campo_simples:
                              label: "Mídia antes da limpeza"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: lv_nota
                            campo_simples:
                              label: "Descrição da limpeza"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                          - id: lv_foto_depois
                            campo_simples:
                              label: "Mídia após limpeza"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Outra Ação ────────────────────────────────────
                  - id: outro
                    label: "Outra Ação"
                    sublabel: "Ação não catalogada acima"
                    icon_name: more_horiz
                    steps:
                      - id: out_dados
                        conteudos:
                          - id: out_descricao
                            campo_simples:
                              label: "Descrição da ação realizada"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                              obrigatorio: true
                          - id: ref_mat_outro
                            ref_materiais:
                              label: "Materiais utilizados (opcional)"
                              sublabel: "Caso esta ação tenha utilizado materiais do catálogo, selecione-os abaixo"
                              origem_catalogo: true
                              obrigatorio: false
                          - id: out_foto
                            campo_simples:
                              label: "Mídia (opcional)"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 3 — Avaliação e Encerramento
    # ═══════════════════════════════════════════════════════════════
    - id: avaliacao
      titulo: "Bloco 3 — Avaliação e Encerramento"
      subtitulo: "Avaliação final da via e observações"

      steps:
        - id: avaliacao_geral
          conteudos:
            - id: avaliacao_condicao
              campo_simples:
                label: "Condição final da via para escalada"
                tipo: DROPDOWN
                ui_hint: LARGE_TILES
                obrigatorio: true
                opcoes:
                  - valor: liberada
                    label: "Liberada para escalada"
                    sublabel: "Via em boas condições"
                    icon_name: check_circle
                  - valor: liberada_restricao
                    label: "Liberada com restrição"
                    sublabel: "Verificar aviso antes de usar"
                    icon_name: warning
                  - valor: interditada
                    label: "Interditada"
                    sublabel: "Não escalar até nova manutenção"
                    icon_name: block
            - id: avaliacao_comentarios
              campo_simples:
                label: "Comentários adicionais (opcional)"
                tipo: TEXT
                ui_hint: TEXT_AREA

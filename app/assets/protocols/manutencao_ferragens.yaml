protocolo:
  id: manutencao_ferragens
  nome: "Manutenção de Proteções Fixas"
  descricao: "Protocolo para manutenção e instalação de proteções fixas (parabolts, chapeletas, argolas e ancoragens)"
  versao: "2.0.0"

  blocos:

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 1 — Materiais a instalar
    # ═══════════════════════════════════════════════════════════════
    - id: materiais
      titulo: "Bloco 1 — Materiais a Instalar"
      subtitulo: "Registre todos os materiais que serão instalados nesta via antes de começar a subir"

      steps:
        - id: lista_materiais
          conteudos:
            - id: lista_materiais_c
              lista_acoes:
                label: "Materiais a instalar"
                sublabel: "Adicione cada material com seus dados de rastreabilidade. Mínimo 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:

                  # ── Parabolt ─────────────────────────────────────
                  - id: parabolt
                    label: "Parabolt"
                    sublabel: "Chumbador expansivo"
                    icon_name: hardware
                    steps:
                      - id: pb_dados
                        conteudos:
                          - id: pb_aviso
                            instrucao:
                              titulo: "Dados do Parabolt"
                              corpo: "Registre todos os dados de rastreabilidade do parabolt antes de instalar. Lote e marca são obrigatórios."
                              nivel_alerta: INFO
                          - id: pb_marca
                            campo_simples:
                              label: "Marca"
                              tipo: TEXT
                              obrigatorio: true
                          - id: pb_liga
                            campo_simples:
                              label: "Liga / Material"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: aco_inox_316
                                  label: "Aço Inox 316L"
                                - valor: aco_inox_304
                                  label: "Aço Inox 304"
                                - valor: titanio
                                  label: "Titânio"
                                - valor: outro
                                  label: "Outro"
                          - id: pb_lote
                            campo_simples:
                              label: "Número de lote"
                              tipo: TEXT
                              obrigatorio: true
                          - id: pb_validade
                            campo_simples:
                              label: "Validade"
                              tipo: DATE
                          - id: pb_foto
                            campo_simples:
                              label: "Foto do material"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Chapeleta ─────────────────────────────────────
                  - id: chapeleta
                    label: "Chapeleta"
                    sublabel: "Placa de distribuição de carga"
                    icon_name: link
                    steps:
                      - id: ch_dados
                        conteudos:
                          - id: ch_marca
                            campo_simples:
                              label: "Marca"
                              tipo: TEXT
                              obrigatorio: true
                          - id: ch_liga
                            campo_simples:
                              label: "Material"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: aco_inox_316
                                  label: "Aço Inox 316L"
                                - valor: titanio
                                  label: "Titânio"
                                - valor: outro
                                  label: "Outro"
                          - id: ch_lote
                            campo_simples:
                              label: "Número de lote"
                              tipo: TEXT
                          - id: ch_foto
                            campo_simples:
                              label: "Foto do material"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Argola ────────────────────────────────────────
                  - id: argola
                    label: "Argola"
                    sublabel: "Anel de ligação"
                    icon_name: radio_button_unchecked
                    steps:
                      - id: arg_dados
                        conteudos:
                          - id: arg_marca
                            campo_simples:
                              label: "Marca"
                              tipo: TEXT
                          - id: arg_liga
                            campo_simples:
                              label: "Material"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: aco_inox_316
                                  label: "Aço Inox 316L"
                                - valor: titanio
                                  label: "Titânio"
                          - id: arg_foto
                            campo_simples:
                              label: "Foto do material"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Ancoragem Química ─────────────────────────────
                  - id: ancoragem_quimica
                    label: "Ancoragem Química"
                    sublabel: "Resina de fixação"
                    icon_name: science
                    steps:
                      - id: aq_dados
                        conteudos:
                          - id: aq_aviso
                            instrucao:
                              titulo: "⚠ Atenção — Validade"
                              corpo: "Verifique a validade antes de usar. Resina fora do prazo NÃO deve ser instalada em proteções de vida."
                              nivel_alerta: PERIGO
                          - id: aq_marca
                            campo_simples:
                              label: "Marca / Produto"
                              tipo: TEXT
                              obrigatorio: true
                          - id: aq_validade
                            campo_simples:
                              label: "Validade"
                              tipo: DATE
                              obrigatorio: true
                          - id: aq_lote
                            campo_simples:
                              label: "Número de lote"
                              tipo: TEXT
                          - id: aq_foto
                            campo_simples:
                              label: "Foto da embalagem"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Cola Química ──────────────────────────────────
                  - id: cola_quimica
                    label: "Cola Química"
                    sublabel: "Adesivo estrutural"
                    icon_name: colorize
                    steps:
                      - id: cq_dados
                        conteudos:
                          - id: cq_aviso
                            instrucao:
                              titulo: "Atenção — Validade"
                              corpo: "Verifique a validade da cola antes de aplicar."
                              nivel_alerta: ATENCAO
                          - id: cq_marca
                            campo_simples:
                              label: "Marca / Produto"
                              tipo: TEXT
                              obrigatorio: true
                          - id: cq_validade
                            campo_simples:
                              label: "Validade"
                              tipo: DATE
                              obrigatorio: true
                          - id: cq_foto
                            campo_simples:
                              label: "Foto da embalagem"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 2 — Identificação da via
    # ═══════════════════════════════════════════════════════════════
    - id: via
      titulo: "Bloco 2 — Identificação da Via"
      subtitulo: "Dados de localização e identificação da via manutenida"

      steps:
        # Card único com GPS + nome + setor + pico em sequência (Feature 1)
        - id: via_localizacao
          conteudos:
            - id: via_aviso
              instrucao:
                titulo: "Identificação da Via"
                corpo: "Preencha os dados de localização da via. A coordenada GPS é obrigatória."
                nivel_alerta: INFO
            - id: via_gps
              campo_simples:
                label: "Localização GPS"
                tipo: GPS
                obrigatorio: true
            - id: via_nome
              campo_simples:
                label: "Nome da via"
                tipo: TEXT
                obrigatorio: true
            - id: via_setor
              campo_simples:
                label: "Setor / Bloco"
                tipo: TEXT
            - id: via_pico
              campo_simples:
                label: "Pico / Área"
                tipo: TEXT

        # Segundo card: permissão do conquistador
        - id: via_permissao
          conteudos:
            - id: via_tem_permissao
              campo_simples:
                label: "Possui permissão do conquistador?"
                tipo: BOOLEAN
                obrigatorio: true
            - id: via_foto_permissao
              campo_simples:
                label: "Foto da permissão (se houver)"
                tipo: IMAGE
                ui_hint: CAMERA_ACTION

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 3 — Ações de manutenção
    # ═══════════════════════════════════════════════════════════════
    - id: acoes
      titulo: "Bloco 3 — Ações de Manutenção"
      subtitulo: "Registre cada ação realizada nesta via. Mínimo 1."

      steps:
        - id: lista_acoes
          conteudos:
            - id: lista_acoes_c
              lista_acoes:
                label: "Ações realizadas"
                sublabel: "Adicione cada ação de manutenção. Mínimo 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:

                  # ── Inspeção de Ancoragem (multi-conteúdo + branching) ──
                  - id: inspecao_ancoragem
                    label: "Inspeção de Ancoragem"
                    sublabel: "Avaliação do estado de uma ancoragem existente"
                    icon_name: search
                    steps:
                      # Card 1: Foto + resultado em um único card (Feature 1!)
                      - id: ia_avaliacao
                        conteudos:
                          - id: ia_instrucao
                            instrucao:
                              titulo: "Avaliação Visual e Mecânica"
                              corpo: "Fotografe o estado atual antes de qualquer intervenção. Em seguida, avalie visualmente (corrosão, trincas) e mecanicamente (reaperto). Classifique o resultado."
                              nivel_alerta: ATENCAO
                          - id: ia_foto_antes
                            campo_simples:
                              label: "Foto antes da intervenção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                          - id: ia_resultado
                            selecao_ramo:
                              label: "Resultado da avaliação"
                              obrigatorio: true
                              ramos:
                                - id: aprovado
                                  label: "Aprovado — Sem intervenção"
                                  sublabel: "Ancoragem em bom estado"
                                  icon_name: check_circle
                                  steps:
                                    - id: ia_ap_detalhe
                                      conteudos:
                                        - id: ia_ap_nota
                                          campo_simples:
                                            label: "Observações"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA

                                - id: reaperto
                                  label: "Reaperto realizado"
                                  sublabel: "Ancoragem reaperta com torquímetro"
                                  icon_name: build
                                  steps:
                                    - id: ia_re_detalhe
                                      conteudos:
                                        - id: ia_re_torque
                                          campo_simples:
                                            label: "Torque aplicado (Nm)"
                                            tipo: NUMBER
                                        - id: ia_re_nota
                                          campo_simples:
                                            label: "Observações"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA

                                - id: substituir
                                  label: "Substituição necessária"
                                  sublabel: "Ancoragem com dano estrutural"
                                  icon_name: swap_horiz
                                  steps:
                                    # Card com instrução + sub-branching (Feature 1 recursivo)
                                    - id: ia_sub_estrategia
                                      conteudos:
                                        - id: ia_sub_aviso
                                          instrucao:
                                            titulo: "Estratégia de Substituição"
                                            corpo: "Se o furo puder ser reutilizado, use ancoragem química. Caso contrário, perfure novo local."
                                            nivel_alerta: PERIGO
                                        - id: ia_sub_ramo
                                          selecao_ramo:
                                            label: "Como será feita a substituição?"
                                            obrigatorio: true
                                            ramos:
                                              - id: reusar_furo
                                                label: "Reutilizar furo existente"
                                                sublabel: "Com ancoragem química"
                                                icon_name: refresh
                                                steps:
                                                  - id: ia_sub_rf_dados
                                                    conteudos:
                                                      - id: ia_sub_rf_materiais
                                                        ref_materiais:
                                                          label: "Materiais utilizados"
                                                          sublabel: "Selecione os materiais do Bloco 1 usados nesta ancoragem"
                                                          id_step_materiais: "lista_materiais_c"
                                                          obrigatorio: true
                                                      - id: ia_sub_rf_foto
                                                        campo_simples:
                                                          label: "Foto após instalação"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true

                                              - id: novo_local
                                                label: "Novo local de perfuração"
                                                sublabel: "Perfuração em posição diferente"
                                                icon_name: gps_fixed
                                                steps:
                                                  - id: ia_sub_nl_dados
                                                    conteudos:
                                                      - id: ia_sub_nl_materiais
                                                        ref_materiais:
                                                          label: "Materiais utilizados"
                                                          sublabel: "Selecione os materiais usados nesta ancoragem"
                                                          id_step_materiais: "lista_materiais_c"
                                                          obrigatorio: true
                                                      - id: ia_sub_nl_nota
                                                        campo_simples:
                                                          label: "Justificativa do novo local"
                                                          tipo: TEXT
                                                          ui_hint: TEXT_AREA
                                                      - id: ia_sub_nl_foto
                                                        campo_simples:
                                                          label: "Foto após instalação"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true

                  # ── Novo Ponto de Ancoragem ───────────────────────
                  - id: novo_ponto
                    label: "Novo Ponto de Ancoragem"
                    sublabel: "Instalação de nova ancoragem"
                    icon_name: add_location
                    steps:
                      - id: np_dados
                        conteudos:
                          - id: np_instrucao
                            instrucao:
                              titulo: "Novo ponto de ancoragem"
                              corpo: "Registre os materiais utilizados e fotografe após a instalação."
                              nivel_alerta: INFO
                          - id: np_materiais
                            ref_materiais:
                              label: "Materiais utilizados"
                              sublabel: "Selecione os materiais do Bloco 1 instalados"
                              id_step_materiais: "lista_materiais_c"
                              obrigatorio: true
                          - id: np_foto
                            campo_simples:
                              label: "Foto após instalação"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true

                  # ── Remoção de Bloco Solto ────────────────────────
                  - id: remocao_bloco
                    label: "Remoção de Bloco Solto"
                    sublabel: "Retirada de pedra instável"
                    icon_name: delete_forever
                    steps:
                      - id: rb_dados
                        conteudos:
                          - id: rb_aviso
                            instrucao:
                              titulo: "ATENÇÃO — Zona de Risco"
                              corpo: "A remoção de blocos deve ser feita com a via interditada e sem presença de pessoas abaixo."
                              nivel_alerta: PERIGO
                          - id: rb_tamanho
                            campo_simples:
                              label: "Tamanho aproximado do bloco"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: pequeno
                                  label: "Pequeno (tamanho de punho)"
                                - valor: medio
                                  label: "Médio (tamanho de melancia)"
                                - valor: grande
                                  label: "Grande (maior que melancia)"
                          - id: rb_foto_antes
                            campo_simples:
                              label: "Foto antes da remoção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: rb_foto_depois
                            campo_simples:
                              label: "Foto após remoção"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Limpeza de Vegetação ──────────────────────────
                  - id: limpeza_vegetacao
                    label: "Limpeza de Vegetação"
                    sublabel: "Retirada de plantas na via"
                    icon_name: grass
                    steps:
                      - id: lv_dados
                        conteudos:
                          - id: lv_foto_antes
                            campo_simples:
                              label: "Foto antes da limpeza"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: lv_nota
                            campo_simples:
                              label: "Descrição da limpeza"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                          - id: lv_foto_depois
                            campo_simples:
                              label: "Foto após limpeza"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

                  # ── Outra Ação ────────────────────────────────────
                  - id: outro
                    label: "Outra Ação"
                    sublabel: "Ação não catalogada acima"
                    icon_name: more_horiz
                    steps:
                      - id: out_dados
                        conteudos:
                          - id: out_descricao
                            campo_simples:
                              label: "Descrição da ação realizada"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                              obrigatorio: true
                          - id: out_foto
                            campo_simples:
                              label: "Foto (opcional)"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 4 — Avaliação e Encerramento
    # ═══════════════════════════════════════════════════════════════
    - id: avaliacao
      titulo: "Bloco 4 — Avaliação e Encerramento"
      subtitulo: "Avaliação final da via e assinatura do mantenedor"

      steps:
        # Card com condição + comentários em sequência (Feature 1)
        - id: avaliacao_geral
          conteudos:
            - id: avaliacao_condicao
              campo_simples:
                label: "Condição final da via para escalada"
                tipo: DROPDOWN
                ui_hint: LARGE_TILES
                obrigatorio: true
                opcoes:
                  - valor: liberada
                    label: "Liberada para escalada"
                    sublabel: "Via em boas condições"
                    icon_name: check_circle
                  - valor: liberada_restricao
                    label: "Liberada com restrição"
                    sublabel: "Verificar aviso antes de usar"
                    icon_name: warning
                  - valor: interditada
                    label: "Interditada"
                    sublabel: "Não escalar até nova manutenção"
                    icon_name: block
            - id: avaliacao_comentarios
              campo_simples:
                label: "Comentários adicionais (opcional)"
                tipo: TEXT
                ui_hint: TEXT_AREA

        # Card de assinatura com declaração + campo em sequência (Feature 1)
        - id: assinatura
          conteudos:
            - id: assinatura_instrucao
              instrucao:
                titulo: "Declaração do Mantenedor"
                corpo: "Ao assinar abaixo, declaro que todas as informações registradas são verdadeiras e que a manutenção foi realizada conforme as normas da ACEC-MG e as boas práticas de escalada."
                nivel_alerta: INFO
            - id: assinatura_c
              campo_simples:
                label: "Assinatura do mantenedor"
                tipo: SIGNATURE
                obrigatorio: true

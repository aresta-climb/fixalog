protocolo:
  id: maintenance
  nome: "Fixed Anchor Maintenance"
  descricao: "Protocol for maintenance and installation of fixed anchors (expansion bolts, hangers, rings, anchors, cleaning and loose blocks)"
  versao: 3

  blocos:
    - id: route
      titulo: "Block 1 — Route Identification"
      subtitulo: "Date, location and identification details of the maintained route"
      steps:
        - id: route_location
          conteudos:
            - id: route_notice
              instrucao:
                titulo: "Route Identification"
                corpo: "Fill in the location and date of the maintenance. GPS coordinates are mandatory."
                nivel_alerta: INFO
            - id: route_date
              campo_simples:
                label: "Maintenance Date"
                sublabel: "Automatically filled with current date (editable)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true
            - id: route_gps
              campo_simples:
                label: "GPS Location"
                tipo: GPS
                obrigatorio: true
            - id: route_name
              campo_simples:
                label: "Route Name"
                tipo: TEXT
                obrigatorio: true
            - id: route_sector
              campo_simples:
                label: "Sector / Crag"
                tipo: TEXT
            - id: route_peak
              campo_simples:
                label: "Peak / Area"
                tipo: TEXT
        - id: route_permission
          conteudos:
            - id: route_has_permission
              campo_simples:
                label: "Do you have permission from the first ascensionist?"
                tipo: BOOLEAN
                obrigatorio: true
            - id: route_permission_media
              campo_simples:
                label: "Permission media (if any)"
                tipo: IMAGE
                ui_hint: CAMERA_ACTION
    - id: actions
      titulo: "Block 2 — Maintenance Actions"
      subtitulo: "Record each action performed on this route. Minimum 1."
      steps:
        - id: action_list
          conteudos:
            - id: action_list_c
              lista_acoes:
                label: "Actions performed"
                sublabel: "Add each maintenance action. Minimum 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:
                  - id: anchor_inspection
                    label: "Anchor Inspection"
                    sublabel: "Assessment of an existing anchor condition"
                    icon_name: search
                    steps:
                      - id: ai_assessment
                        conteudos:
                          - id: ai_instruction
                            instrucao:
                              titulo: "Visual and Mechanical Assessment"
                              corpo: "Record the current condition before any intervention. Then assess visually (corrosion, cracks) and mechanically (retightening). Classify the result."
                              nivel_alerta: ATENCAO
                          - id: ai_media_before
                            campo_simples:
                              label: "Media before intervention"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                          - id: ai_result
                            selecao_ramo:
                              label: "Assessment result"
                              obrigatorio: true
                              ramos:
                                - id: approved
                                  label: "Approved — No intervention"
                                  sublabel: "Anchor in good condition"
                                  icon_name: check_circle
                                  steps:
                                    - id: ai_ap_detail
                                      conteudos:
                                        - id: ai_ap_notes
                                          campo_simples:
                                            label: "Observations"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA
                                - id: retightened
                                  label: "Retightening performed"
                                  sublabel: "Anchor retightened with torque wrench"
                                  icon_name: build
                                  steps:
                                    - id: ai_rt_detail
                                      conteudos:
                                        - id: ai_rt_torque
                                          campo_simples:
                                            label: "Applied torque (Nm)"
                                            tipo: NUMBER
                                        - id: ai_rt_notes
                                          campo_simples:
                                            label: "Observations"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA
                                - id: replace
                                  label: "Replacement required"
                                  sublabel: "Anchor with structural damage"
                                  icon_name: swap_horiz
                                  steps:
                                    - id: ai_rep_strategy
                                      conteudos:
                                        - id: ai_rep_notice
                                          instrucao:
                                            titulo: "Replacement Strategy"
                                            corpo: "If the hole can be reused, use a glue-in anchor. Otherwise, drill a new location."
                                            nivel_alerta: PERIGO
                                        - id: ai_rep_branch
                                          selecao_ramo:
                                            label: "How will the replacement be performed?"
                                            obrigatorio: true
                                            ramos:
                                              - id: reuse_hole
                                                label: "Reuse existing hole"
                                                sublabel: "With glue-in anchor"
                                                icon_name: refresh
                                                steps:
                                                  - id: ai_rep_rh_data
                                                    conteudos:
                                                      - id: ref_mat_reuse_hole
                                                        ref_materiais:
                                                          label: "Materials used"
                                                          sublabel: "Select the catalog materials installed at this anchor or register a new one"
                                                          origem_catalogo: true
                                                          obrigatorio: true
                                                      - id: ai_rep_rh_media
                                                        campo_simples:
                                                          label: "Media after installation"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true
                                              - id: new_location
                                                label: "New drilling location"
                                                sublabel: "Drilling in a different position"
                                                icon_name: gps_fixed
                                                steps:
                                                  - id: ai_rep_nl_data
                                                    conteudos:
                                                      - id: ref_mat_new_location
                                                        ref_materiais:
                                                          label: "Materials used"
                                                          sublabel: "Select the catalog materials installed at this anchor or register a new one"
                                                          origem_catalogo: true
                                                          obrigatorio: true
                                                      - id: ai_rep_nl_notes
                                                        campo_simples:
                                                          label: "Justification for new location"
                                                          tipo: TEXT
                                                          ui_hint: TEXT_AREA
                                                      - id: ai_rep_nl_media
                                                        campo_simples:
                                                          label: "Media after installation"
                                                          tipo: IMAGE
                                                          ui_hint: CAMERA_ACTION
                                                          obrigatorio: true
                  - id: new_anchor_point
                    label: "New Anchor Point"
                    sublabel: "Installation of a new anchor"
                    icon_name: add_location
                    steps:
                      - id: na_data
                        conteudos:
                          - id: na_instruction
                            instrucao:
                              titulo: "New anchor point"
                              corpo: "Select the installed materials from your local catalog and record media after installation."
                              nivel_alerta: INFO
                          - id: ref_mat_new_anchor
                            ref_materiais:
                              label: "Materials used"
                              sublabel: "Select the catalog materials installed at this point or register a new one"
                              origem_catalogo: true
                              obrigatorio: true
                          - id: na_media
                            campo_simples:
                              label: "Media after installation"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                  - id: loose_rock_removal
                    label: "Loose Block Removal"
                    sublabel: "Removal of unstable rock"
                    icon_name: delete_forever
                    steps:
                      - id: lr_data
                        conteudos:
                          - id: lr_notice
                            instrucao:
                              titulo: "WARNING — Hazard Zone"
                              corpo: "Block removal must be performed with the route closed and no people below."
                              nivel_alerta: PERIGO
                          - id: lr_size
                            campo_simples:
                              label: "Approximate block size"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: small
                                  label: "Small (fist-sized)"
                                - valor: medium
                                  label: "Medium (watermelon-sized)"
                                - valor: large
                                  label: "Large (larger than a watermelon)"
                          - id: lr_media_before
                            campo_simples:
                              label: "Media before removal"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: lr_media_after
                            campo_simples:
                              label: "Media after removal"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                  - id: vegetation_cleaning
                    label: "Vegetation Cleaning"
                    sublabel: "Removal of plants on the route"
                    icon_name: grass
                    steps:
                      - id: vc_data
                        conteudos:
                          - id: vc_media_before
                            campo_simples:
                              label: "Media before cleaning"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: vc_notes
                            campo_simples:
                              label: "Cleaning description"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                          - id: vc_media_after
                            campo_simples:
                              label: "Media after cleaning"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                  - id: other
                    label: "Other Action"
                    sublabel: "Action not listed above"
                    icon_name: more_horiz
                    steps:
                      - id: oth_data
                        conteudos:
                          - id: oth_description
                            campo_simples:
                              label: "Description of action performed"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                              obrigatorio: true
                          - id: ref_mat_other
                            ref_materiais:
                              label: "Materials used (optional)"
                              sublabel: "If this action used catalog materials, select them below"
                              origem_catalogo: true
                              obrigatorio: false
                          - id: oth_media
                            campo_simples:
                              label: "Media (optional)"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
    - id: assessment
      titulo: "Block 3 — Evaluation & Closure"
      subtitulo: "Final route evaluation and observations"
      steps:
        - id: general_assessment
          conteudos:
            - id: assessment_condition
              campo_simples:
                label: "Final route condition for climbing"
                tipo: DROPDOWN
                ui_hint: LARGE_TILES
                obrigatorio: true
                opcoes:
                  - valor: open
                    label: "Open for climbing"
                    sublabel: "Route in good condition"
                    icon_name: check_circle
                  - valor: open_with_restrictions
                    label: "Open with restrictions"
                    sublabel: "Check notice before climbing"
                    icon_name: warning
                  - valor: closed
                    label: "Closed"
                    sublabel: "Do not climb until further maintenance"
                    icon_name: block
            - id: assessment_comments
              campo_simples:
                label: "Additional comments (optional)"
                tipo: TEXT
                ui_hint: TEXT_AREA

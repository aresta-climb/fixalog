protocolo:
  nome: "Registre Express"
  descricao: "Enregistrement libre et rapide d'occurrences, médias, coordonnées et matériels sans structure préétablie."
blocos:
  identification_block:
    titulo: "Bloc 1 — Identification et Lieu"
    subtitulo: "Titre de l'enregistrement, date et localisation optionnelle"
  evidence_block:
    titulo: "Bloc 2 — Preuves et Matériels"

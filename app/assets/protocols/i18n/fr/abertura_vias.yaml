protocolo:
  nome: "Ouverture de Voie"
  descricao: "Registre technique d'expertise d'ouverture de nouvelles voies d'escalade et des ancrages fixes installés."
blocos:
  via:
    titulo: "Bloc 1 — Identification de la Nouvelle Voie"
    subtitulo: "Données techniques de localisation, ouvreurs et ligne de la nouvelle voie"
  acoes:
    titulo: "Bloc 2 — Ancrages et Actions de l'Ouverture"
    subtitulo: "Enregistrez chaque ancrage fixe, relais ou nettoyage effectué lors de l'ouverture. Minimum 1."
  avaliacao:
    titulo: "Bloc 3 — Évaluation et Clôture"
    subtitulo: "Condition de la voie et équipement nécessaire pour répétition"
conteudos:
  via_aviso:
    titulo: "Identification de l'Ouverture"
    corpo: "Remplissez les données de la nouvelle voie, les coordonnées GPS du pied et enregistrez l'image du tracé/topo."
  via_data:
    label: "Date de l'Ouverture"
    sublabel: "Remplie automatiquement avec la date actuelle (modifiable)"
  via_gps:
    label: "Localisation GPS du Pied de Voie"
    sublabel: "Capturez les coordonnées géographiques exactes du pied de la voie"
  via_nome:
    label: "Nom de la Voie"
    sublabel: "Nom donné à la voie par l'ouvreur / les ouvreurs"
  via_conquistadores:
    label: "Ouvreur(s)"
    sublabel: "Noms des ouvreurs participants"
  via_graduacao:
    label: "Cotation Estimée"
    sublabel: "Ex. : 6c+, 7b, ED-"
  via_extensao:
    label: "Longueur / Longueurs"
    sublabel: "Ex. : 25m (couenne) ou 150m / 4 longueurs"
  via_setor:
    label: "Secteur / Bloc"
  via_pico:
    label: "Sommet / Zone"
  via_foto_linha:
    label: "Média du Secteur / Ligne de la Voie"
    sublabel: "Joignez photo, vidéo ou PDF montrant la ligne de la voie ou le topo"
  pi_posicao:
    label: "Position / Identification de l'Ancrage"
    sublabel: "Ex. : 1er point, L2 - 4e plaquette"
  ref_mat_protecao:
    label: "Matériels utilisés"
    sublabel: "Sélectionnez les matériels du catalogue installés sur ce point ou enregistrez-en un nouveau"
  pi_foto:
    label: "Média après installation"
  pi_nota:
    label: "Observations (optionnel)"
  pr_posicao:
    label: "Identification du Relais"
    sublabel: "Ex. : Relais R1, Relais Final"
  ref_mat_parada:
    label: "Matériels utilisés au relais"
    sublabel: "Sélectionnez les matériels du catalogue installés sur ce relais ou enregistrez-en un nouveau"
  pr_foto:
    label: "Média après installation"
  pr_nota:
    label: "Observations (optionnel)"
  rb_aviso:
    titulo: "ATTENTION — Zone de Danger"
    corpo: "La purge de blocs doit être effectuée avec le pied de voie isolé et sans personne en contrebas."
  rb_tamanho:
    label: "Taille approximative du bloc"
    opcoes:
      pequeno:
        label: "Petit (taille du poing)"
      medio:
        label: "Moyen (taille d'une pastèque)"
      grande:
        label: "Grand (plus grand qu'une pastèque)"
  rb_foto_antes:
    label: "Média avant la purge"
  rb_foto_depois:
    label: "Média après la purge"
  lv_foto_antes:
    label: "Média avant le nettoyage"
  lv_nota:
    label: "Description du nettoyage"
  lv_foto_depois:
    label: "Média après le nettoyage"
  out_descricao:
    label: "Description de l'action effectuée"
  ref_mat_outro:
    label: "Matériels utilisés (optionnel)"
    sublabel: "Si cette action a utilisé des matériels du catalogue, sélectionnez-les ci-dessous"
  out_foto:
    label: "Média (optionnel)"
  lista_acoes_c:
    label: "Ancrages et Actions Réalisés"
    sublabel: "Ajoutez chaque ancrage fixe installé, relais ou intervention sur le rocher. Minimum 1."
  avaliacao_condicao:
    label: "Condition actuelle de la voie"
    opcoes:
      liberada:
        label: "Ouverte à l'escalade"
        sublabel: "Ouverture terminée et prête pour les répétitions"
      em_conquista:
        label: "En cours d'ouverture / Projet ouvert"
        sublabel: "Voie non encore terminée"
      liberada_restricao:
        label: "Ouverte avec restriction"
        sublabel: "Vérifier les recommandations avant répétition"
  avaliacao_comentarios:
    label: "Équipement suggéré pour répétition et commentaires (optionnel)"
    sublabel: "Ex. : 12 dégaines, jeu de coinceurs #0.5 à #2, corde de 60m"
tipos_acao:
  protecao_instalada:
    label: "Ancrage Fixe Installé"
    sublabel: "Installation de plaquette, goujon, broche ou scellement chimique"
  parada_rapel:
    label: "Relais / Rappel Installé"
    sublabel: "Installation de relais double/triple ou station de rappel"
  remocao_bloco:
    label: "Purge de Bloc Instable"
    sublabel: "Retrait de pierre ou écaille instable lors de l'ouverture"
  limpeza_vegetacao:
    label: "Nettoyage de Végétation"
    sublabel: "Nettoyage des prises ou fissures sur la ligne d'ouverture"
  outro:
    label: "Autre Action"
    sublabel: "Action ou enregistrement supplémentaire de l'ouverture"
opcoes:
  pequeno:
    label: "Petit (taille du poing)"
  medio:
    label: "Moyen (taille d'une pastèque)"
  grande:
    label: "Grand (plus grand qu'une pastèque)"
  liberada:
    label: "Ouverte à l'escalade"
    sublabel: "Ouverture terminée et prête pour les répétitions"
  em_conquista:
    label: "En cours d'ouverture / Projet ouvert"
    sublabel: "Voie non encore terminée"
  liberada_restricao:
    label: "Ouverte avec restriction"
    sublabel: "Vérifier les recommandations avant répétition"

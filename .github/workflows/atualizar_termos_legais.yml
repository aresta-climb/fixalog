name: Atualizar Termos Legais

on:
  repository_dispatch:
    types: [update-legal-terms]
  workflow_dispatch:

jobs:
  atualizar-submodulo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar Token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout do Código
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Atualizar Submódulo Legal
        run: |
          git submodule update --remote app/legal/repo

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Cache de Dependências Pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('ferramentas/atualizador_legal/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Baixar Dependências
        run: |
          cd ferramentas/atualizador_legal
          dart pub get

      - name: Executar Atualizador de Versão
        run: |
          cd ferramentas/atualizador_legal
          dart run bin/atualizar_versao_legal.dart ../../app/legal/repo ../../app/lib/core/constantes/versao_legal.g.dart

      - name: Commitar Alterações
        run: |
          git config --global user.name "aresta-climb-bot[bot]"
          git config --global user.email "281080576+aresta-climb-bot[bot]@users.noreply.github.com"
          git add app/legal/repo app/lib/core/constantes/versao_legal.g.dart
          git commit -m "chore: atualizar termos legais e versao compilada" || echo "Sem alteracoes para commit"
          git push

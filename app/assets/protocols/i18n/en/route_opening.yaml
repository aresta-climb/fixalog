protocolo:
  nome: "Route Opening"
  descricao: "Forensic technical record of first ascent or development of new climbing routes and installed fixed anchors."
blocos:
  route:
    titulo: "Block 1 — New Route Identification"
    subtitulo: "Technical data of location, first ascensionists and line of the new route"
  actions:
    titulo: "Block 2 — Installed Anchors & Opening Actions"
    subtitulo: "Record each fixed anchor, belay station or cleaning performed during route opening. Minimum 1."
  assessment:
    titulo: "Block 3 — Evaluation & Closure"
    subtitulo: "Route condition and required gear for repeats"
conteudos:
  route_notice:
    titulo: "First Ascent Identification"
    corpo: "Fill in the new route details, base GPS coordinates and record an image of the route line/topo."
  route_date:
    label: "Opening / First Ascent Date"
    sublabel: "Automatically filled with current date (editable)"
  route_gps:
    label: "Base GPS Location"
    sublabel: "Capture the exact geographic coordinates of the route base"
  route_name:
    label: "Route Name"
    sublabel: "Name given to the route by the first ascensionist(s)"
  route_first_ascensionists:
    label: "First Ascensionist(s)"
    sublabel: "Names of participating first ascensionists"
  route_grade:
    label: "Estimated Grade"
    sublabel: "E.g.: 5.11d, 7a, 6b+ E2"
  route_length:
    label: "Length / Pitches"
    sublabel: "E.g.: 25m (sport) or 150m / 4 pitches"
  route_sector:
    label: "Sector / Crag"
  route_peak:
    label: "Peak / Area"
  route_line_media:
    label: "Sector / Route Line Media"
    sublabel: "Attach photo, video or PDF showing the route line or topo"
  ia_position:
    label: "Anchor Position / Identification"
    sublabel: "E.g.: 1st bolt, Pitch 2 - 4th hanger"
  ref_mat_protection:
    label: "Materials used"
    sublabel: "Select the catalog materials installed at this point or register a new one"
  ia_media:
    label: "Media after installation"
  ia_notes:
    label: "Observations (optional)"
  ba_position:
    label: "Belay Station Identification"
    sublabel: "E.g.: Belay P1, Top Anchor"
  ref_mat_belay:
    label: "Materials used at the belay station"
    sublabel: "Select the catalog materials installed at this belay station or register a new one"
  ba_media:
    label: "Media after installation"
  ba_notes:
    label: "Observations (optional)"
  lr_notice:
    titulo: "WARNING — Hazard Zone"
    corpo: "Block removal must be performed with the base isolated and no people below."
  lr_size:
    label: "Approximate block size"
    opcoes:
      small:
        label: "Small (fist-sized)"
      medium:
        label: "Medium (watermelon-sized)"
      large:
        label: "Large (larger than a watermelon)"
  lr_media_before:
    label: "Media before removal"
  lr_media_after:
    label: "Media after removal"
  vc_media_before:
    label: "Media before cleaning"
  vc_notes:
    label: "Cleaning description"
  vc_media_after:
    label: "Media after cleaning"
  oth_description:
    label: "Description of action performed"
  ref_mat_other:
    label: "Materials used (optional)"
    sublabel: "If this action used catalog materials, select them below"
  oth_media:
    label: "Media (optional)"
  action_list_c:
    label: "Installed Anchors & Actions Performed"
    sublabel: "Add each installed fixed anchor, belay station or rock intervention. Minimum 1."
  assessment_condition:
    label: "Current route condition"
    opcoes:
      open:
        label: "Open for climbing"
        sublabel: "Opening completed and ready for repeats"
      project_in_progress:
        label: "In development / Open project"
        sublabel: "Route not yet completed"
      open_with_restrictions:
        label: "Open with restrictions"
        sublabel: "Check recommendations before repeating"
  assessment_comments:
    label: "Suggested gear for repeats and comments (optional)"
    sublabel: "E.g.: 12 quickdraws, cams #0.5 to #2, 60m rope"
tipos_acao:
  installed_protection:
    label: "Installed Fixed Anchor"
    sublabel: "Installation of hanger, expansion bolt, staple or glue-in anchor"
  belay_rappel_station:
    label: "Installed Belay / Rappel Station"
    sublabel: "Installation of double/triple belay or rappel station"
  loose_rock_removal:
    label: "Loose Block Removal"
    sublabel: "Removal of unstable rock or flake during route opening"
  vegetation_cleaning:
    label: "Vegetation Cleaning"
    sublabel: "Cleaning of holds or cracks along the new route line"
  other:
    label: "Other Action"
    sublabel: "Additional opening action or record"
opcoes:
  small:
    label: "Small (fist-sized)"
  medium:
    label: "Medium (watermelon-sized)"
  large:
    label: "Large (larger than a watermelon)"
  open:
    label: "Open for climbing"
    sublabel: "Opening completed and ready for repeats"
  project_in_progress:
    label: "In development / Open project"
    sublabel: "Route not yet completed"
  open_with_restrictions:
    label: "Open with restrictions"
    sublabel: "Check recommendations before repeating"

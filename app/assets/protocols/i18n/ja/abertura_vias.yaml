  out_foto:
    label: "メディア（任意）"
  lista_acoes_c:
    label: "設置支点および実施作業"
    sublabel: "設置した各固定支点、終了点、岩への処置を追加してください（最低1件）。"
  avaliacao_condicao:
    label: "ルートの現在の状態"
    opcoes:
      liberada:
        label: "登攀可能（開放）"
        sublabel: "開拓完了・再登可能"
      em_conquista:
        label: "開拓中 / 未完了プロジェクト"
        sublabel: "ルートはまだ完成していません"
      liberada_restricao:
        label: "条件付きで登攀可能"
        sublabel: "再登前に推奨事項を確認してください"
  avaliacao_comentarios:
    label: "再登時の推奨ギアおよびコメント（任意）"
    sublabel: "例：クイックドロー12本、カム #0.5〜#2、60mロープ"
tipos_acao:
  protecao_instalada:
    label: "設置した固定支点"
    sublabel: "ハンガー、ボルト、ステープル、またはケミカルアンカーの設置"
  parada_rapel:
    label: "設置した終了点 / 懸垂支点"
    sublabel: "2点・3点終了点または懸垂ステーションの設置"
  remocao_bloco:
    label: "浮石の除去"
    sublabel: "開拓中の浮石や不安定なフレークの除去"
  limpeza_vegetacao:
    label: "植生の清掃"
    sublabel: "開拓ライン上のホールドやクラックの清掃"
  outro:
    label: "その他の作業"
    sublabel: "開拓における追加作業または記録"
opcoes:
  pequeno:
    label: "小（拳サイズ）"
  medio:
    label: "中（スイカサイズ）"
  grande:
    label: "大（スイカ以上）"

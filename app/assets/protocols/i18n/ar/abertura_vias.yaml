protocolo:
  nome: "فتح مسار تسلق جديد"
  descricao: "سجل فني جنائي لفتح أو تطوير مسارات تسلق جديدة ونقاط التثبيت الثابتة المركبة."
blocos:
  via:
    titulo: "الكتلة 1 — تعريف المسار الجديد"

name: fixalog
description: "Aplicativo de inventário e vistoria técnica de proteções em vias de escalada."
publish_to: 'none'
version: 0.1.4-dev+7

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.7
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  pointycastle: ^4.0.0
  printing: ^5.14.3
  protobuf: ^6.0.0
  yaml: ^3.1.2
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  xml: ^7.0.1
  basic_utils: ^5.8.2
  path: ^1.9.0
  uuid: ^4.3.0
  local_auth: ^3.0.1
  flutter_image_compress: ^2.4.0

  meta: any
  shared_preferences: ^2.5.5
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  ffmpeg_kit_flutter_new: ^4.3.2
  share_plus: ^13.2.0
  open_filex: ^4.7.0
  gal: ^2.3.2
  flutter_markdown_plus: ^1.0.7
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  file_picker: ^13.3.0
  archive: any
  qr: any
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1
  sentry_flutter: ^10.2.0
  feedback: ^3.1.0
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_local_notifications: ^22.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  sentry_dart_plugin: ^3.4.0

  geolocator_platform_interface: any
  plugin_platform_interface: any
  path_provider_platform_interface: any
  flutter_image_compress_platform_interface: any
  ffmpeg_kit_flutter_platform_interface: any
  cross_file: any
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/protocols/
    - protos/
    - assets/protocols/i18n/pt/
    - assets/protocols/i18n/en/
    - assets/protocols/i18n/es/
    - assets/protocols/i18n/fr/
    - assets/protocols/i18n/de/
    - assets/protocols/i18n/ar/
    - assets/protocols/i18n/ja/
    - assets/fonts/
    - assets/logo_app.png
    - assets/logo_splash.png
    - legal/repo/public/docs/termos-de-uso-fixalog.md
    - legal/repo/public/docs/politica-de-privacidade-fixalog.md
    - legal/repo/public/docs/pt/
    - legal/repo/public/docs/en/
    - legal/repo/public/docs/es/
    - legal/repo/public/docs/fr/
    - legal/repo/public/docs/de/
    - legal/repo/public/docs/ar/
    - legal/repo/public/docs/ja/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "#121416"
  adaptive_icon_foreground: "assets/logo_app.png"

flutter_native_splash:
  color: "#121416"
  image: "assets/logo_splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/logo_splash.png"
    icon_background_color: "#121416"

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: fixalog
  org: aresta-climb

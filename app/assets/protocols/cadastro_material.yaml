protocolo:
  id: material_registration
  nome: "Maintenance Material Registration"
  descricao: "Protocol for cataloging, traceability, quality testing and manufacturing processes of maintenance materials or assemblies"
  versao: 2

  blocos:
    - id: material_identification
      titulo: "Block 1 — General Identification"
      subtitulo: "Identification of single material or material assembly"
      steps:
        - id: general_identification
          conteudos:
            - id: mat_instruction
              instrucao:
                titulo: "Material or Assembly Identification"
                corpo: "Define a clear name for this material or assembly (e.g., '3/8 Bolt + Hanger Kit' or '316 Stainless Threaded Rod 14cm'). This name will appear in the catalog when selecting materials during maintenance."
                nivel_alerta: INFO
            - id: mat_name
              campo_simples:
                label: "Material or Assembly Name"
                sublabel: "Descriptive name for quick identification in the catalog"
                tipo: TEXT
                obrigatorio: true
            - id: mat_association_code
              campo_simples:
                label: "Association Tracking Code"
                sublabel: "Internal association control code (optional)"
                tipo: TEXT
                obrigatorio: false
            - id: mat_date
              campo_simples:
                label: "Record Date"
                sublabel: "Automatically filled with current date (editable)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true
    - id: material_composition
      titulo: "Block 2 — Material Specifications"
      subtitulo: "Add each material that makes up this record, including invoice, tests and details"
      steps:
        - id: material_item_list
          conteudos:
            - id: material_items_list_c
              lista_acoes:
                label: "Registered Materials"
                sublabel: "Add 1 single material or multiple items that form the assembly. Minimum 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:
                  - id: expansion_bolt
                    label: "Mechanical Anchor / Expansion Bolt"
                    sublabel: "Expansion bolt or mechanical stud anchor"
                    icon_name: hardware
                    steps:
                      - id: eb_data
                        conteudos:
                          - id: eb_brand
                            campo_simples:
                              label: "Brand / Manufacturer"
                              tipo: TEXT
                              obrigatorio: true
                          - id: eb_alloy
                            campo_simples:
                              label: "Alloy / Material"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: stainless_steel_316
                                  label: "316 / 316L Stainless Steel"
                                - valor: stainless_steel_304
                                  label: "304 Stainless Steel"
                                - valor: titanium
                                  label: "Titanium"
                                - valor: other
                                  label: "Other"
                          - id: eb_dimensions
                            campo_simples:
                              label: "Diameter and Length"
                              sublabel: "E.g.: 3/8 x 90mm or 10mm x 100mm"
                              tipo: TEXT
                          - id: eb_batch
                            campo_simples:
                              label: "Batch / Lot Number"
                              tipo: TEXT
                          - id: eb_expiry
                            campo_simples:
                              label: "Expiration Date (if applicable)"
                              tipo: DATE
                          - id: eb_media
                            campo_simples:
                              label: "Material photo"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: eb_invoice_number
                            campo_simples:
                              label: "Invoice / Receipt (Number or Access Key)"
                              tipo: TEXT
                          - id: eb_invoice_supplier
                            campo_simples:
                              label: "Supplier / Store"
                              tipo: TEXT
                          - id: eb_invoice_media
                            campo_simples:
                              label: "Invoice / Receipt Photo or PDF"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: eb_tests
                            lista_acoes:
                              label: "Quality Tests"
                              sublabel: "Add tensile, shear or batch inspection tests (optional)"
                              minimo: 0
                              maximo: 0
                              tipos_disponiveis:
                                - id: quality_test
                                  label: "Quality Test"
                                  sublabel: "Mechanical, chemical test or lab report"
                                  icon_name: science

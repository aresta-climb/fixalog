protocolo:
  id: express_log
  nome: "Express Log"
  descricao: "Fast, free-form record of occurrences, media, coordinates and materials without predefined structure."
  versao: 3

  blocos:
    - id: identification_block
      titulo: "Block 1 — Identification & Location"
      subtitulo: "Record title, date and optional location"
      steps:
        - id: identification_step
          conteudos:
            - id: route_name
              campo_simples:
                label: "Record Title / Identification"
                sublabel: "Route name, location or subject to identify this record in History"
                tipo: TEXT
                obrigatorio: true
            - id: route_date
              campo_simples:
                label: "Record Date"
                sublabel: "Automatically filled with current date (editable)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true
            - id: route_gps
              campo_simples:
                label: "GPS Coordinates (optional)"
                sublabel: "Capture the current location if desired."
                tipo: GPS
                obrigatorio: false
            - id: general_notes
              campo_simples:
                label: "General Observations (optional)"
                tipo: TEXT
                ui_hint: TEXT_AREA
                obrigatorio: false
    - id: evidence_block
      titulo: "Block 2 — Evidence & Materials"
      subtitulo: "Add media with descriptions and link catalog materials if desired"
      steps:
        - id: evidence_step
          conteudos:
            - id: evidence_list
              lista_acoes:
                label: "Evidence (Photos, Videos or PDFs)"
                sublabel: "Add as many media records and notes as desired (optional)."
                minimo: 0
                maximo: 0
                tipos_disponiveis:
                  - id: evidence_item
                    label: "Evidence / Note"
                    sublabel: "Photos, videos or PDFs with description"
                    icon_name: camera
                    steps:
                      - id: evidence_item_step
                        conteudos:
                          - id: ev_media
                            campo_simples:
                              label: "Evidence Media"
                              sublabel: "Attach photos, videos or PDFs"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                          - id: ev_description
                            campo_simples:
                              label: "Description (optional)"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                              obrigatorio: false
            - id: ref_mat_express
              ref_materiais:
                label: "Related Materials (optional)"
                sublabel: "Select materials from the local catalog if this record involves any hardware"
                origem_catalogo: true
                obrigatorio: false

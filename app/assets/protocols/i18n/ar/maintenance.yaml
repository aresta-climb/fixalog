protocolo:
  nome: "صيانة نقاط التثبيت الثابتة"
  descricao: "بروتوكول لصيانة وتركيب نقاط التثبيت الثابتة (مسامير التمدد، الصفائح، الحلقات، المراسي، التنظيف والكتل الصخرية غير المستقرة)"
blocos:

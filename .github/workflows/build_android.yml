name: Android Release Sub-Workflow 

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'A tag do git para construir'
        required: true
        type: string
      enviar_para_producao:
        description: 'Enviar para Produção nas lojas?'
        required: false
        type: boolean
        default: true
      release_notes:
        description: 'Notas de lançamento da versão'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Compilar e Publicar Android
    runs-on: ubuntu-latest

    steps:
      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obter dependências do Flutter
        working-directory: ./app
        run: flutter pub get

      - name: Decodificar Keystore de Release
        working-directory: ./app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > upload-keystore.jks

      - name: Compilar Android App Bundle (AAB)
        working-directory: ./app
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORE_FILE: upload-keystore.jks
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Validar e Fazer Upload de Símbolos para o Sentry (Fail-Fast)
        working-directory: ./app
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN não configurado nos secrets do GitHub! O build de release não pode ser publicado sem símbolos de desofuscação no Sentry."
            exit 1
          fi
          dart run sentry_dart_plugin

      - name: Empacotar Símbolos de Depuração Nativos
        working-directory: ./app
        run: |
          SRC_DIR="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="build/app/intermediates/merged_native_libs/release/out/lib"
          fi
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="build/app/intermediates/stripped_native_libs/release/out/lib"
          fi
          mkdir -p build/native-debug-symbols
          DEST_ZIP="$(pwd)/build/native-debug-symbols/native-debug-symbols.zip"
          if [ -d "$SRC_DIR" ]; then
            cd "$SRC_DIR"
            zip -r "$DEST_ZIP" ./*
            cd - > /dev/null
          else
            touch empty_symbol
            zip -j "$DEST_ZIP" empty_symbol
            rm empty_symbol
          fi

      - name: Salvar Artefatos de Release Android (AAB, Mappings e Símbolos)
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ inputs.tag_name }}
          path: |
            app/build/app/outputs/bundle/release/*.aab
            app/build/app/outputs/mapping/release/
            app/build/symbols
            app/build/native-debug-symbols/native-debug-symbols.zip
          retention-days: 90

      - name: Upload de Símbolos Dart para o Firebase Crashlytics
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        working-directory: ./app
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON não configurada."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > $GOOGLE_APPLICATION_CREDENTIALS
          if [ ! -d "build/symbols" ]; then
            echo "::error::Diretório build/symbols não encontrado."
            exit 1
          fi
          echo "Enviando símbolos Dart do Android para o Crashlytics..."
          npx --yes firebase-tools crashlytics:symbols:upload \
            --app="1:1025411452942:android:3161d968aec1b093d92c5f" \
            build/symbols

      - name: Preparar Notas de Versão para Google Play
        env:
          NOTAS_LANCAMENTO: ${{ inputs.release_notes }}
        run: |
          mkdir -p app/build/whatsnew
          echo "$NOTAS_LANCAMENTO" > app/build/whatsnew/whatsnew-pt-BR
          echo "Arquivo whatsnew-pt-BR criado com sucesso em app/build/whatsnew/whatsnew-pt-BR"

      - name: Preparar e Validar Credencial da Google Play Service Account
        env:
          RAW_SA_JSON: ${{ secrets.ANDROID_PLAY_STORE_CONFIG_JSON }}
        run: |
          python3 - << 'PY'
          import base64, json, os, sys

          raw = os.environ.get("RAW_SA_JSON", "").strip()
          if not raw:
              print("::error::Secret ANDROID_PLAY_STORE_CONFIG_JSON está vazio nos Secrets do repositório!")
              sys.exit(1)

          if not raw.startswith("{"):
              try:
                  raw = base64.b64decode(raw).decode("utf-8").strip()
              except Exception as exc:
                  print(f"::error::ANDROID_PLAY_STORE_CONFIG_JSON não é um JSON válido nem Base64: {exc}")
                  sys.exit(1)

          data = json.loads(raw)
          pk = data.get("private_key", "")
          if "\\n" in pk:
              data["private_key"] = pk.replace("\\n", "\n")

          print(f"Service Account carregada: client_email={data.get('client_email')} | private_key_id={data.get('private_key_id')}")
          out_path = os.path.join(os.environ["RUNNER_TEMP"], "play-service-account.json")
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(data, f)
          PY

      - name: Upload para Google Play Console
        id: upload_play
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.arestaclimb.fixalog
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          mappingFile: app/build/app/outputs/mapping/release/mapping.txt
          debugSymbols: app/build/native-debug-symbols/native-debug-symbols.zip
          tracks: ${{ inputs.enviar_para_producao && 'internal,production' || 'internal' }}
          whatsNewDirectory: app/build/whatsnew
          status: completed

      - name: Fallback Resiliente Google Play (Faixa Interna e Draft)
        if: steps.upload_play.outcome != 'success'
        env:
          SA_PATH: ${{ runner.temp }}/play-service-account.json
          PACKAGE_NAME: com.arestaclimb.fixalog
          AAB_PATH: app/build/app/outputs/bundle/release/app-release.aab
          MAPPING_PATH: app/build/app/outputs/mapping/release/mapping.txt
          SYMBOLS_PATH: app/build/native-debug-symbols/native-debug-symbols.zip
          NOTAS_LANCAMENTO: ${{ inputs.release_notes }}
          ENVIAR_PRODUCAO: ${{ inputs.enviar_para_producao }}
        run: |
          pip install --quiet google-api-python-client google-auth google-auth-httplib2 httplib2
          python3 - << 'PY'
          import os, sys, socket
          import httplib2
          import google_auth_httplib2
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload

          socket.setdefaulttimeout(300)

          pkg = os.environ["PACKAGE_NAME"]
          sa_path = os.environ["SA_PATH"]
          aab_path = os.environ["AAB_PATH"]
          mapping_path = os.environ["MAPPING_PATH"]
          symbols_path = os.environ["SYMBOLS_PATH"]
          notas = os.environ.get("NOTAS_LANCAMENTO", "").strip()
          enviar_prod = os.environ.get("ENVIAR_PRODUCAO", "false").lower() == "true"

          creds = service_account.Credentials.from_service_account_file(
              sa_path, scopes=["https://www.googleapis.com/auth/androidpublisher"]
          )
          authed_http = google_auth_httplib2.AuthorizedHttp(creds, http=httplib2.Http(timeout=300))
          service = build("androidpublisher", "v3", http=authed_http)
          release_notes = [{"language": "pt-BR", "text": notas}] if notas else []

          def garantir_bundle_e_simbolos(edit_id):
              try:
                  media = MediaFileUpload(aab_path, mimetype="application/octet-stream", chunksize=10 * 1024 * 1024, resumable=True)
                  bundle = service.edits().bundles().upload(packageName=pkg, editId=edit_id, media_body=media).execute(num_retries=3)
                  vc = bundle["versionCode"]
                  print(f"AAB enviado com sucesso: versionCode={vc}")
              except HttpError as exc:
                  detalhe = exc.content.decode("utf-8", errors="replace") if hasattr(exc, "content") else str(exc)
                  print(f"Aviso ao enviar AAB ({exc.resp.status}): {detalhe} | consultando bundles existentes...")
                  bundles_resp = service.edits().bundles().list(packageName=pkg, editId=edit_id).execute()
                  bundles = bundles_resp.get("bundles", [])
                  if not bundles:
                      raise
                  vc = max(b["versionCode"] for b in bundles)
                  print(f"Reutilizando bundle existente na Play Store: versionCode={vc}")

              if os.path.exists(mapping_path):
                  try:
                      m_media = MediaFileUpload(mapping_path, mimetype="application/octet-stream")
                      service.edits().deobfuscationfiles().upload(
                          packageName=pkg, editId=edit_id, apkVersionCode=vc,
                          deobfuscationFileType="proguard", media_body=m_media
                      ).execute(num_retries=2)
                  except HttpError as exc:
                      print(f"Aviso ao anexar mapping ProGuard: {exc}")

              if os.path.exists(symbols_path):
                  try:
                      s_media = MediaFileUpload(symbols_path, mimetype="application/octet-stream")
                      service.edits().deobfuscationfiles().upload(
                          packageName=pkg, editId=edit_id, apkVersionCode=vc,
                          deobfuscationFileType="nativeCode", media_body=s_media
                      ).execute(num_retries=2)
                  except HttpError as exc:
                      print(f"Aviso ao anexar símbolos nativos: {exc}")
              return vc

          def publicar_em_faixa(track_name, vc_existente=None):
              edit = service.edits().insert(packageName=pkg, body={}).execute()
              eid = edit["id"]
              vc = vc_existente if vc_existente is not None else garantir_bundle_e_simbolos(eid)
              for status_tentativa in ("completed", "draft"):
                  for usar_notas in (True, False):
                      for not_sent in (False, True):
                          try:
                              release_body = {
                                  "status": status_tentativa,
                                  "versionCodes": [str(vc)],
                              }
                              if usar_notas and release_notes:
                                  release_body["releaseNotes"] = release_notes
                              service.edits().tracks().update(
                                  packageName=pkg,
                                  editId=eid,
                                  track=track_name,
                                  body={"track": track_name, "releases": [release_body]},
                              ).execute()
                              res = service.edits().commit(
                                  packageName=pkg, editId=eid, changesNotSentForReview=not_sent
                              ).execute()
                              print(f"Sucesso na faixa '{track_name}' (status='{status_tentativa}', notas={usar_notas}, changesNotSentForReview={not_sent}, editId={res.get('id')})!")
                              return vc
                          except HttpError as exc:
                              detalhe = exc.content.decode("utf-8", errors="replace") if hasattr(exc, "content") else str(exc)
                              print(f"Tentativa faixa='{track_name}' status='{status_tentativa}' notas={usar_notas} changesNotSentForReview={not_sent} falhou ({exc.resp.status}): {detalhe}")
              return None

          vc_publicado = publicar_em_faixa("internal")
          if vc_publicado is None:
              print("::error::Não foi possível publicar na faixa 'internal' da Google Play.")
              sys.exit(1)

          if enviar_prod:
              vc_prod = publicar_em_faixa("production", vc_existente=vc_publicado)
              if vc_prod is None:
                  print("::warning::A faixa 'production' ainda não permite publicação direta (ex.: app em rascunho ou requisito de testes fechados no Google Play Console). O bundle já foi publicado com sucesso na faixa 'internal'!")
          PY

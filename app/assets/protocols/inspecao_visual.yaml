protocolo:
  id: visual_inspection
  nome: "Visual Inspection of Fixed Anchors"
  descricao: "Periodic monitoring and point-by-point visual inspection report of existing fixed anchors without mechanical intervention."
  versao: 3

  blocos:
    - id: route
      titulo: "Block 1 — Route Identification"
      subtitulo: "Date, location and identification details of the inspected route"
      steps:
        - id: route_location
          conteudos:
            - id: route_notice
              instrucao:
                titulo: "Route Identification"
                corpo: "Fill in the location and date of the visual inspection. GPS coordinates are mandatory."
                nivel_alerta: INFO
            - id: route_date
              campo_simples:
                label: "Inspection Date"
                sublabel: "Automatically filled with current date (editable)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true
            - id: route_gps
              campo_simples:
                label: "GPS Location"
                tipo: GPS
                obrigatorio: true
            - id: route_name
              campo_simples:
                label: "Route Name"
                tipo: TEXT
                obrigatorio: true
            - id: route_sector
              campo_simples:
                label: "Sector / Crag"
                tipo: TEXT
            - id: route_peak
              campo_simples:
                label: "Peak / Area"
                tipo: TEXT
    - id: inspection
      titulo: "Block 2 — Point-by-Point Inspection"
      subtitulo: "Record the visual condition of each evaluated point along the route. Minimum 1."
      steps:
        - id: inspection_list
          conteudos:
            - id: inspection_list_c
              lista_acoes:
                label: "Inspected Points"
                sublabel: "Add each evaluated anchor, belay station or rock condition. Minimum 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:
                  - id: anchor_protection
                    label: "Anchor / Bolt"
                    sublabel: "Intermediate hanger, expansion bolt, staple or glue-in anchor"
                    icon_name: search
                    steps:
                      - id: vi_ap_data
                        conteudos:
                          - id: vi_ap_position
                            campo_simples:
                              label: "Point Position / Identification"
                              sublabel: "E.g.: 1st bolt, 3rd staple, crux bolt"
                              tipo: TEXT
                              obrigatorio: true
                          - id: vi_ap_condition
                            campo_simples:
                              label: "Overall Anchor Condition"
                              sublabel: "Visually assess the physical integrity of the metal and placement."
                              tipo: DROPDOWN
                              ui_hint: LARGE_TILES
                              obrigatorio: true
                              opcoes:
                                - valor: good
                                  label: "Good"
                                  sublabel: "NO ISSUES"
                                  icon_name: check_circle
                                - valor: worn
                                  label: "Worn / Attention"
                                  sublabel: "MONITOR"
                                  icon_name: visibility
                                - valor: critical
                                  label: "Critical / Condemned"
                                  sublabel: "REQUIRES REPLACEMENT"
                                  icon_name: warning
                          - id: vi_ap_corrosion
                            campo_simples:
                              label: "Presence of Corrosion or Looseness?"
                              sublabel: "Check for signs of rust, cracks or hanger rotation."
                              tipo: BOOLEAN
                              obrigatorio: true
                          - id: vi_ap_notes
                            campo_simples:
                              label: "Observations"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                          - id: vi_ap_media
                            campo_simples:
                              label: "Evidence Media"
                              sublabel: "Attach photos or videos showing the condition of the point"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                  - id: belay_rappel_station
                    label: "Belay / Rappel Station"
                    sublabel: "Double/triple anchor station, rings or chains"
                    icon_name: radio_button_unchecked
                    steps:
                      - id: vi_ba_data
                        conteudos:
                          - id: vi_ba_position
                            campo_simples:
                              label: "Belay Station Identification"
                              sublabel: "E.g.: Belay P1, Top Anchor"
                              tipo: TEXT
                              obrigatorio: true
                          - id: vi_ba_condition
                            campo_simples:
                              label: "Overall Belay Station Condition"
                              tipo: DROPDOWN
                              ui_hint: LARGE_TILES
                              obrigatorio: true
                              opcoes:
                                - valor: good
                                  label: "Good"
                                  sublabel: "NO ISSUES"
                                  icon_name: check_circle
                                - valor: worn
                                  label: "Worn / Attention"
                                  sublabel: "MONITOR RING/LINK WEAR"
                                  icon_name: visibility
                                - valor: critical
                                  label: "Critical / Condemned"
                                  sublabel: "REQUIRES IMMEDIATE MAINTENANCE"
                                  icon_name: warning
                          - id: vi_ba_corrosion
                            campo_simples:
                              label: "Presence of Corrosion or Deep Grooving?"
                              tipo: BOOLEAN
                              obrigatorio: true
                          - id: vi_ba_notes
                            campo_simples:
                              label: "Observations"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                          - id: vi_ba_media
                            campo_simples:
                              label: "Evidence Media"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                              obrigatorio: true
                  - id: rock_environment
                    label: "Rock / Environment"
                    sublabel: "Loose block, unstable flake, vegetation or approach"
                    icon_name: terrain
                    steps:
                      - id: vi_re_data
                        conteudos:
                          - id: vi_re_description
                            campo_simples:
                              label: "Occurrence Location and Description"
                              tipo: TEXT
                              ui_hint: TEXT_AREA
                              obrigatorio: true
                          - id: vi_re_condition
                            campo_simples:
                              label: "Attention Level"
                              tipo: DROPDOWN
                              ui_hint: LARGE_TILES
                              obrigatorio: true
                              opcoes:
                                - valor: informative
                                  label: "Informational / Low Risk"
                                  sublabel: "No immediate impact on safety"
                                  icon_name: check_circle
                                - valor: warning
                                  label: "Caution"
                                  sublabel: "Requires care when climbing or future cleaning"
                                  icon_name: visibility
                                - valor: critical
                                  label: "Critical Risk"
                                  sublabel: "Risk of rockfall or accident"
                                  icon_name: warning
                          - id: vi_re_media
                            campo_simples:
                              label: "Evidence Media (optional)"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
    - id: assessment
      titulo: "Block 3 — Final Route Status"
      subtitulo: "Overall summary of the route condition after visual inspection"
      steps:
        - id: general_assessment
          conteudos:
            - id: assessment_condition
              campo_simples:
                label: "Final route status for climbing"
                tipo: DROPDOWN
                ui_hint: LARGE_TILES
                obrigatorio: true
                opcoes:
                  - valor: open
                    label: "Open for climbing"
                    sublabel: "Anchors in good visual condition"
                    icon_name: check_circle
                  - valor: open_with_restrictions
                    label: "Open with restrictions"
                    sublabel: "Points require attention — check observations"
                    icon_name: warning
                  - valor: closed
                    label: "Closed / Awaiting Maintenance"
                    sublabel: "Do not climb until maintenance is performed"
                    icon_name: block
            - id: assessment_comments
              campo_simples:
                label: "General inspection summary and observations (optional)"
                tipo: TEXT
                ui_hint: TEXT_AREA

    sublabel: "Remplie automatiquement avec la date actuelle (modifiable)"
  route_gps:
    label: "Coordonnées GPS (optionnel)"
    sublabel: "Capturez la localisation actuelle si souhaité."
  general_notes:
    label: "Observations Générales (optionnel)"
  ev_media:
    label: "Médias de la Preuve"
    sublabel: "Joignez des photos, vidéos ou PDF"
  ev_description:
    label: "Description (optionnel)"
  evidence_list:
    label: "Preuves (Photos, Vidéos ou PDF)"
    sublabel: "Ajoutez autant d'enregistrements médias et de notes que souhaité (optionnel)."
  ref_mat_express:
    label: "Matériels Associés (optionnel)"
    sublabel: "Sélectionnez des matériels du catalogue local si cet enregistrement implique un équipement"
tipos_acao:
  evidence_item:

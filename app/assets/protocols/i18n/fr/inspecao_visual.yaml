protocolo:
  nome: "Inspection Visuelle des Ancrages Fixes"
  descricao: "Rapport de suivi périodique et d'inspection visuelle point par point des ancrages fixes existants sans intervention mécanique."
blocos:
  via:
    titulo: "Bloc 1 — Identification de la Voie"
    subtitulo: "Données de date, localisation et identification de la voie inspectée"
  inspecao:
    titulo: "Bloc 2 — Inspection Point par Point"
    subtitulo: "Enregistrez l'état visuel de chaque point évalué le long de la voie. Minimum 1."
  avaliacao:
    titulo: "Bloc 3 — État Final de la Voie"
    subtitulo: "Résumé général de l'état de la voie après l'inspection visuelle"
conteudos:
  via_aviso:
    titulo: "Identification de la Voie"
    corpo: "Remplissez les données de localisation et la date de l'inspection visuelle. La coordonnée GPS est obligatoire."
  via_data:
    label: "Date de l'Inspection"
    sublabel: "Remplie automatiquement avec la date actuelle (modifiable)"
  via_gps:
    label: "Localisation GPS"
  via_nome:
    label: "Nom de la voie"
  via_setor:
    label: "Secteur / Bloc"
  via_pico:
    label: "Sommet / Zone"
  iv_pa_posicao:
    label: "Position / Identification du Point"
    sublabel: "Ex. : 1er point, 3e broche, point du crux"
  iv_pa_estado:
    label: "État Général de la Protection"
    sublabel: "Évaluez visuellement l'intégrité physique du métal et de la fixation."
    opcoes:
      bom:
        label: "Bon"
        sublabel: "AUCUNE ANOMALIE"
      desgastado:
        label: "Usé / Attention"
        sublabel: "À SURVEILLER"
      critico:
        label: "Critique / Condamné"
        sublabel: "REMPLACEMENT REQUIS"
  iv_pa_corrosao:
    label: "Présence de Corrosion ou de Jeu ?"
    sublabel: "Vérifiez les signes d'oxydation, fissures ou rotation de la plaquette."
  iv_pa_nota:
    label: "Observations"
  iv_pa_midia:
    label: "Médias de Preuve"
    sublabel: "Joignez des photos ou vidéos montrant l'état du point"
  iv_pr_posicao:
    label: "Identification du Relais"
    sublabel: "Ex. : Relais R1, Relais Final"
  iv_pr_estado:
    label: "État Général du Relais"
    opcoes:
      bom:
        label: "Bon"
        sublabel: "AUCUNE ANOMALIE"
      desgastado:
        label: "Usé / Attention"
        sublabel: "SURVEILLER L'USURE DE L'ANNEAU/MAILLON"
      critico:
        label: "Critique / Condamné"
        sublabel: "MAINTENANCE IMMÉDIATE REQUISE"
  iv_pr_corrosao:
    label: "Présence de Corrosion ou d'Usure Prononcée ?"
  iv_pr_nota:
    label: "Observations"
  iv_pr_midia:
    label: "Médias de Preuve"
  iv_ra_descricao:
    label: "Localisation et Description de l'Observation"
  iv_ra_estado:
    label: "Niveau d'Attention"
    opcoes:
      informativo:
        label: "Informatif / Risque Faible"
        sublabel: "Aucun impact immédiat sur la sécurité"
      atencao:
        label: "Attention"
        sublabel: "Requiert de la prudence en grimpant ou un nettoyage futur"
      critico:
        label: "Risque Critique"
        sublabel: "Risque de chute de bloc ou d'accident"
  iv_ra_midia:
    label: "Médias de Preuve (optionnel)"
  lista_inspecao_c:
    label: "Points Inspectés"
    sublabel: "Ajoutez chaque ancrage, relais ou état du rocher évalué. Minimum 1."
  avaliacao_condicao:
    label: "État final de la voie pour l'escalade"
    opcoes:
      liberada:
        label: "Ouverte à l'escalade"
        sublabel: "Ancrages en bon état visuel"
      liberada_restricao:
        label: "Ouverte avec restriction"
        sublabel: "Certains points demandent de l'attention — voir observations"
      interditada:
        label: "Fermée / En Attente de Maintenance"
        sublabel: "Ne pas grimper avant la réalisation de la maintenance"
  avaliacao_comentarios:
    label: "Résumé et observations générales de l'inspection (optionnel)"
tipos_acao:
  protecao_ancoragem:
    label: "Protection / Ancrage"
    sublabel: "Plaquette, goujon, broche ou scellement chimique intermédiaire"
  parada_rapel:
    label: "Relais / Rappel"
    sublabel: "Ensemble de relais double/triple, anneaux ou chaînes"
  rocha_ambiente:
    label: "Rocher / Environnement"
    sublabel: "Bloc instable, écaille fragile, végétation ou accès"
opcoes:
  bom:
    label: "Bon"
    sublabel: "AUCUNE ANOMALIE"
  desgastado:
    label: "Usé / Attention"
    sublabel: "À SURVEILLER"
  critico:
    label: "Critique / Condamné"
    sublabel: "REMPLACEMENT REQUIS"
  informativo:

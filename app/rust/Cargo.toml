[package]
name = "rust_lib_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cms = { version = "0.2.3", features = ["builder", "std"] }
der = "0.8.0"
flutter_rust_bridge = "=2.12.0"
lopdf = "0.43.0"
rcgen = "0.14.8"
rsa = "0.9.10"
sha2 = "0.11.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

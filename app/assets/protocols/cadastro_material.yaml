protocolo:
  id: cadastro_material
  nome: "Cadastro de Material de Manutenção"
  descricao: "Protocolo para catalogação, rastreabilidade, testes de qualidade e processos de fabricação de materiais ou conjuntos para manutenção"
  versao: "1.0.0"

  blocos:

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 1 — Identificação Geral do Material ou Conjunto
    # ═══════════════════════════════════════════════════════════════
    - id: identificacao_material
      titulo: "Bloco 1 — Identificação Geral"
      subtitulo: "Identificação do material isolado ou conjunto de materiais"

      steps:
        - id: identificacao_geral
          conteudos:
            - id: mat_instrucao
              instrucao:
                titulo: "Identificação do Material ou Conjunto"
                corpo: "Defina um nome claro para este material ou conjunto (ex.: 'Kit Parabolt 3/8 + Chapeleta Bonier' ou 'Barra Roscada Inox 316 14cm'). Este nome aparecerá no catálogo ao selecionar materiais durante uma manutenção."
                nivel_alerta: INFO
            - id: mat_nome
              campo_simples:
                label: "Nome do Material ou Conjunto"
                sublabel: "Nome descritivo para identificação rápida no catálogo"
                tipo: TEXT
                obrigatorio: true
            - id: mat_codigo_associacao
              campo_simples:
                label: "Código de Rastreamento da Associação"
                sublabel: "Código interno de controle da associação (opcional)"
                tipo: TEXT
                obrigatorio: false
            - id: mat_data
              campo_simples:
                label: "Data do Registro"
                sublabel: "Preenchida automaticamente com a data atual (editável)"
                tipo: DATE
                obrigatorio: true
                preencher_data_atual: true

    # ═══════════════════════════════════════════════════════════════
    # BLOCO 2 — Lista de Materiais (1 ou mais itens do conjunto)
    # ═══════════════════════════════════════════════════════════════
    - id: composicao_materiais
      titulo: "Bloco 2 — Especificação dos Materiais"
      subtitulo: "Adicione cada material que compõe este registro, incluindo nota fiscal, testes e detalhes"

      steps:
        - id: lista_itens_material
          conteudos:
            - id: lista_itens_material_c
              lista_acoes:
                label: "Materiais Cadastrados"
                sublabel: "Adicione 1 material isolado ou múltiplos itens que formam o conjunto. Mínimo 1."
                minimo: 1
                maximo: 0
                tipos_disponiveis:

                  # ── 1. Chumbador Mecânico / Parabolt ────────────────────
                  - id: parabolt
                    label: "Chumbador Mecânico / Parabolt"
                    sublabel: "Chumbador expansivo ou prisioneiro mecânico"
                    icon_name: hardware
                    steps:
                      - id: pb_dados
                        conteudos:
                          - id: pb_marca
                            campo_simples:
                              label: "Marca / Fabricante"
                              tipo: TEXT
                              obrigatorio: true
                          - id: pb_liga
                            campo_simples:
                              label: "Liga / Material"
                              tipo: DROPDOWN
                              opcoes:
                                - valor: aco_inox_316
                                  label: "Aço Inox 316 / 316L"
                                - valor: aco_inox_304
                                  label: "Aço Inox 304"
                                - valor: titanio
                                  label: "Titânio"
                                - valor: outro
                                  label: "Outro"
                          - id: pb_dimensoes
                            campo_simples:
                              label: "Diâmetro e Comprimento"
                              sublabel: "Ex.: 3/8 x 90mm ou 10mm x 100mm"
                              tipo: TEXT
                          - id: pb_lote
                            campo_simples:
                              label: "Número de lote"
                              tipo: TEXT
                          - id: pb_validade
                            campo_simples:
                              label: "Validade (se aplicável)"
                              tipo: DATE
                          - id: pb_foto
                            campo_simples:
                              label: "Foto do material"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: pb_nf_numero
                            campo_simples:
                              label: "Nota Fiscal / Comprovante (Número ou Chave)"
                              tipo: TEXT
                          - id: pb_nf_fornecedor
                            campo_simples:
                              label: "Fornecedor / Loja"
                              tipo: TEXT
                          - id: pb_nf_foto
                            campo_simples:
                              label: "Foto ou PDF da Nota Fiscal / Comprovante"
                              tipo: IMAGE
                              ui_hint: CAMERA_ACTION
                          - id: pb_testes
                            lista_acoes:
                              label: "Testes de Qualidade"
                              sublabel: "Adicione ensaios de tração, cisalhamento ou inspeções de lote (opcional)"
                              minimo: 0
                              maximo: 0
                              tipos_disponiveis:
                                - id: teste_qualidade
                                  label: "Teste de Qualidade"
                                  sublabel: "Ensaio mecânico, químico ou laudo"
                                  icon_name: science
                                  steps:
                                    - id: pb_tq_step
                                      conteudos:
                                        - id: tq_tipo
                                          campo_simples:
                                            label: "Tipo de Ensaio / Teste"
                                            tipo: TEXT
                                            obrigatorio: true
                                        - id: tq_resultado
                                          campo_simples:
                                            label: "Resultado / Carga Obtida"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA
                                            obrigatorio: true
                                        - id: tq_foto
                                          campo_simples:
                                            label: "Anexar Mídias ao Teste / Laudo"
                                            tipo: IMAGE
                                            ui_hint: CAMERA_ACTION
                          - id: pb_detalhes
                            lista_acoes:
                              label: "Detalhes e Processo de Fabricação"
                              sublabel: "Adicione informações extras ou passo-a-passo de preparação/fabricação (opcional)"
                              minimo: 0
                              maximo: 0
                              tipos_disponiveis:
                                - id: detalhe_item
                                  label: "Detalhe / Etapa de Fabricação"
                                  sublabel: "Descrição livre com fotos, vídeos ou PDFs"
                                  icon_name: build
                                  steps:
                                    - id: pb_det_step
                                      conteudos:
                                        - id: det_titulo
                                          campo_simples:
                                            label: "Título do Detalhe ou Etapa"
                                            tipo: TEXT
                                            obrigatorio: true
                                        - id: det_descricao
                                          campo_simples:
                                            label: "Descrição Detalhada"
                                            tipo: TEXT
                                            ui_hint: TEXT_AREA
                                            obrigatorio: true
                                        - id: det_foto
                                          campo_simples:
                                            label: "Anexar Mídias à Etapa / Detalhe"
                                            tipo: IMAGE
                                            ui_hint: CAMERA_ACTION

                  # ── 2. Chapeleta ────────────────────────────────────────

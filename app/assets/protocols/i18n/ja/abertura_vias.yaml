protocolo:
  nome: "ルート開拓"
  descricao: "新しいクライミングルートの初登・開拓および設置された固定支点の技術鑑定記録。"
blocos:
  via:
    titulo: "ブロック 1 — 新規ルートの特定"
    subtitulo: "新規ルートの位置、開拓者、ラインの技術データ"
  acoes:
    titulo: "ブロック 2 — 設置支点および開拓作業"
    subtitulo: "開拓中に設置した各固定支点、終了点、清掃作業を記録してください（最低1件）。"
  avaliacao:
    titulo: "ブロック 3 — 最終評価と完了"
    subtitulo: "ルートの状態および再登に必要なギア"
conteudos:
  via_aviso:
    titulo: "開拓情報の特定"
    corpo: "新規ルートの詳細、取り付きのGPS座標を入力し、ルートライン・トポの画像を記録してください。"
  via_data:
    label: "開拓・初登日"
    sublabel: "現在の日付が自動入力されます（編集可能）"
  via_gps:
    label: "取り付きのGPS位置情報"
    sublabel: "ルート取り付きの正確な地理座標を取得してください"
  via_nome:
    label: "ルート名"
    sublabel: "開拓者が命名したルート名"
  via_conquistadores:
    label: "開拓者・初登者"
    sublabel: "参加した開拓者の氏名"
  via_graduacao:
    label: "推定グレード"
    sublabel: "例：5.11b、6c+、3級"
  via_extensao:
    label: "全長 / ピッチ数"
    sublabel: "例：25m（スポート）または 150m / 4ピッチ"
  via_setor:
    label: "セクター / エリア"
  via_pico:
    label: "ピーク / 山域"
  via_foto_linha:
    label: "セクター / ルートラインのメディア"
    sublabel: "ルートラインまたはトポを示す写真・動画・PDFを添付してください"
  pi_posicao:
    label: "支点の位置 / 識別"
    sublabel: "例：1ピン目、2ピッチ目・4枚目のハンガー"
  ref_mat_protecao:
    label: "使用した資材"
    sublabel: "このポイントに設置したカタログ資材を選択するか、新規登録してください"
  pi_foto:
    label: "設置後のメディア"
  pi_nota:
    label: "備考（任意）"
  pr_posicao:
    label: "終了点の識別"
    sublabel: "例：P1終了点、最終終了点"
  ref_mat_parada:
    label: "終了点で使用した資材"
    sublabel: "この終了点に設置したカタログ資材を選択するか、新規登録してください"
  pr_foto:
    label: "設置後のメディア"
  pr_nota:
    label: "備考（任意）"
  rb_aviso:
    titulo: "警告 — 危険区域"
    corpo: "浮石の除去は取り付き周辺を立入禁止にし、下部に人がいない状態で実施してください。"
  rb_tamanho:
    label: "浮石のおおよそのサイズ"
    opcoes:
      pequeno:
        label: "小（拳サイズ）"
      medio:
        label: "中（スイカサイズ）"
      grande:
        label: "大（スイカ以上）"
  rb_foto_antes:
    label: "除去前のメディア"
  rb_foto_depois:
    label: "除去後のメディア"
  lv_foto_antes:
    label: "清掃前のメディア"
  lv_nota:
    label: "清掃内容の説明"
  lv_foto_depois:
    label: "清掃後のメディア"
  out_descricao:
    label: "実施した作業の説明"
  ref_mat_outro:
    label: "使用した資材（任意）"

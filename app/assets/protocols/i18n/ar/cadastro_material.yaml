    titulo: "تعريف المادة أو المجموعة"
    corpo: "حدد اسماً واضحاً لهذه المادة أو المجموعة (مثل: 'طقم مسمار تمدد 3/8 + صفيحة' أو 'قضيب ملولب فولاذ مقاوم للصدأ 316 بطول 14 سم'). سيظهر هذا الاسم في الكتالوج عند اختيار المواد أثناء الصيانة."

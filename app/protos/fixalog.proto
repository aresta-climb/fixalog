syntax = "proto3";
package fixalog;

message Protocolo {
  string id = 1;
  string nome = 2;
  string descricao = 4;
  repeated Campo campos = 3;
}

message Opcao {
  string valor = 1;
  string label = 2;
  string sublabel = 3;
  string icon_name = 4;
}

message Campo {
  string id = 1;
  string label = 2;
  string sublabel = 3;
  
  enum Tipo { 
    TEXT = 0; 
    NUMBER = 1; 
    DROPDOWN = 2; 
    IMAGE = 3; 
    BOOLEAN = 4; 
    GPS = 5; 
    VIDEO = 6;
    SIGNATURE = 7;
  }
  Tipo tipo = 4;

  enum UIHint {
    DEFAULT = 0;
    LARGE_TILES = 1;
    CAMERA_ACTION = 2;
  }
  UIHint ui_hint = 5;

  bool obrigatorio = 6;
  repeated Opcao opcoes = 7;
}

message SubmissaoProtocolo {
  string id_sessao = 1;
  string id_protocolo = 2;
  int64 utc_timestamp_gps = 3;
  bytes assinatura_visual = 4; 
  repeated RespostaCampo respostas = 5;
  bytes digital_assinatura_do_hash = 6;
}

message RespostaCampo {
  string id_campo = 1;
  string valor_texto = 2;
  bytes valor_midia = 3; 
}

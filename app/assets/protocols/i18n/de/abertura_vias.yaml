protocolo:
  nome: "Routenerschließung"
  descricao: "Technisches Sachverständigenprotokoll über die Erstbegehung oder Erschließung neuer Kletterrouten und installierter fester Sicherungspunkte."
blocos:
  via:
    titulo: "Block 1 — Identifikation der Neuen Route"
    subtitulo: "Technische Daten zu Standort, Erstbegehern und Linie der neuen Route"
  acoes:
    titulo: "Block 2 — Sicherungspunkte und Erschließungsmaßnahmen"
    subtitulo: "Erfassen Sie jeden festen Sicherungspunkt, Umlenker oder jede Reinigung bei der Erschließung. Mindestens 1."
  avaliacao:
    titulo: "Block 3 — Bewertung und Abschluss"
    subtitulo: "Routenzustand und erforderliche Ausrüstung für Wiederholungen"
conteudos:
  via_aviso:
    titulo: "Identifikation der Erschließung"
    corpo: "Geben Sie die Daten der neuen Route und die GPS-Koordinaten des Einstiegs ein und erfassen Sie ein Bild der Routenlinie/des Topos."
  via_data:
    label: "Erschließungsdatum"
    sublabel: "Automatisch mit dem aktuellen Datum ausgefüllt (bearbeitbar)"
  via_gps:
    label: "GPS-Standort des Einstiegs"
    sublabel: "Erfassen Sie die genauen geografischen Koordinaten des Routeneinstiegs"
  via_nome:
    label: "Routenname"
    sublabel: "Name der Route durch den/die Erstbegeher"
  via_conquistadores:
    label: "Erstbegeher"
    sublabel: "Namen der beteiligten Erstbegeher"
  via_graduacao:
    label: "Geschätzter Schwierigkeitsgrad"
    sublabel: "Z. B.: 7+, 8-, 6b E2"
  via_extensao:
    label: "Länge / Seillängen"
    sublabel: "Z. B.: 25m (Sportklettern) oder 150m / 4 Seillängen"
  via_setor:
    label: "Sektor / Wandbereich"
  via_pico:
    label: "Gipfel / Gebiet"
  via_foto_linha:
    label: "Medien des Sektors / der Routenlinie"
    sublabel: "Fügen Sie Foto, Video oder PDF mit der Routenlinie oder dem Topo hinzu"
  pi_posicao:
    label: "Position / Kennung des Sicherungspunkts"
    sublabel: "Z. B.: 1. Haken, 2. Seillänge - 4. Lasche"
  ref_mat_protecao:
    label: "Verwendete Materialien"
    sublabel: "Wählen Sie die an diesem Punkt installierten Katalogmaterialien aus oder registrieren Sie ein neues"
  pi_foto:
    label: "Medien nach der Installation"
  pi_nota:
    label: "Bemerkungen (optional)"
  pr_posicao:
    label: "Kennung des Standplatzes"
    sublabel: "Z. B.: Standplatz S1, Umlenker Ende"
  ref_mat_parada:
    label: "Am Standplatz verwendete Materialien"
    sublabel: "Wählen Sie die an diesem Standplatz installierten Katalogmaterialien aus oder registrieren Sie ein neues"
  pr_foto:
    label: "Medien nach der Installation"
  pr_nota:
    label: "Bemerkungen (optional)"
  rb_aviso:
    titulo: "ACHTUNG — Gefahrenbereich"
    corpo: "Das Entfernen von Blöcken muss bei abgesperrtem Wandfuß und ohne Personen darunter erfolgen."
  rb_tamanho:
    label: "Ungefähre Blockgröße"
    opcoes:
      pequeno:
        label: "Klein (faustgroß)"
      medio:
        label: "Mittel (wassermelonengroß)"
      grande:
        label: "Groß (größer als eine Wassermelone)"
  rb_foto_antes:
    label: "Medien vor dem Entfernen"
  rb_foto_depois:
    label: "Medien nach dem Entfernen"
  lv_foto_antes:
    label: "Medien vor der Reinigung"
  lv_nota:
    label: "Beschreibung der Reinigung"
  lv_foto_depois:
    label: "Medien nach der Reinigung"
  out_descricao:
    label: "Beschreibung der durchgeführten Maßnahme"
  ref_mat_outro:
    label: "Verwendete Materialien (optional)"
    sublabel: "Falls bei dieser Maßnahme Katalogmaterialien verwendet wurden, wählen Sie diese unten aus"
  out_foto:
    label: "Medien (optional)"
  lista_acoes_c:
    label: "Installierte Sicherungspunkte und Maßnahmen"
    sublabel: "Fügen Sie jeden installierten Sicherungspunkt, Standplatz oder Felseingriff hinzu. Mindestens 1."
  avaliacao_condicao:
    label: "Aktueller Zustand der Route"
    opcoes:
      liberada:
        label: "Freigegeben zum Klettern"
        sublabel: "Erschließung abgeschlossen und bereit für Wiederholungen"
      em_conquista:
        label: "In Erschließung / Offenes Projekt"
        sublabel: "Route noch nicht fertiggestellt"
      liberada_restricao:
        label: "Mit Einschränkungen freigegeben"
        sublabel: "Empfehlungen vor Wiederholung prüfen"
  avaliacao_comentarios:
    label: "Empfohlene Ausrüstung für Wiederholungen und Kommentare (optional)"
    sublabel: "Z. B.: 12 Expressschlingen, Klemmgeräte #0.5 bis #2, 60m-Seil"
tipos_acao:
  protecao_instalada:
    label: "Installierter Fester Sicherungspunkt"
    sublabel: "Installation von Lasche, Bohrhaken, Bühlerhaken oder Verbundanker"
  parada_rapel:
    label: "Installierter Standplatz / Abseilstelle"
    sublabel: "Installation eines Doppel-/Dreifach-Standplatzes oder einer Abseilstelle"
  remocao_bloco:
    label: "Entfernung Loser Blöcke"
    sublabel: "Beseitigung von losem Fels oder Schuppen während der Erschließung"
  limpeza_vegetacao:
    label: "Vegetationsreinigung"
    sublabel: "Reinigung von Griffen oder Rissen entlang der neuen Routenlinie"
  outro:
    label: "Sonstige Maßnahme"
    sublabel: "Zusätzliche Maßnahme oder Eintrag der Erschließung"
opcoes:
  pequeno:
    label: "Klein (faustgroß)"
  medio:
    label: "Mittel (wassermelonengroß)"
  grande:
    label: "Groß (größer als eine Wassermelone)"
  liberada:
    label: "Freigegeben zum Klettern"
    sublabel: "Erschließung abgeschlossen und bereit für Wiederholungen"
  em_conquista:
    label: "In Erschließung / Offenes Projekt"
    sublabel: "Route noch nicht fertiggestellt"
  liberada_restricao:
    label: "Mit Einschränkungen freigegeben"
    sublabel: "Empfehlungen vor Wiederholung prüfen"

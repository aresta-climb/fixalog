name: Android Release Sub-Workflow 

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'A tag do git para construir'
        required: true
        type: string

jobs:
  build:
    name: Compilar e Publicar Android
    runs-on: ubuntu-latest

    steps:
      - name: Gerar GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout do Repositório
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}
          token: ${{ steps.app-token.outputs.token }}
          submodules: 'recursive'

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Rust Toolchain e Targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache de dependências Pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Obter dependências do Flutter
        working-directory: ./app
        run: flutter pub get

      - name: Decodificar Keystore de Release
        working-directory: ./app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > upload-keystore.jks

      - name: Compilar Android App Bundle (AAB)
        working-directory: ./app
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORE_FILE: upload-keystore.jks
        run: flutter build appbundle --release

      - name: Upload para Google Play Console (Faixa Interna)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_STORE_CONFIG_JSON }}
          packageName: com.arestaclimb.fixlog
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

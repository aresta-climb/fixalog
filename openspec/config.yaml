schema: spec-driven

context: |
  Stack tecnológica: Flutter, Riverpod (Gerenciamento de Estado), Isar (Banco de Dados Local), Protobuf.
  Domínio: Fixalog - Catalogação, auditoria técnica e laudos periciais de proteções fixas durante a abertura ou manutenção de vias de escalada.
  Arquitetura: Estrutura de diretórios orientada a funcionalidades em `app/lib/features` e `app/lib/core`.

  IMPORTANTE: Você DEVE seguir rigorosamente os princípios de engenharia definidos no arquivo `AGENTS.md` na raiz do repositório. Leia este arquivo antes de tomar decisões arquiteturais, propor mudanças ou implementar código e testes.

rules:
  proposal:
    - OBRIGATÓRIO estar escrito em português brasileiro (PT-BR).
    - Considerar integralmente os 8 princípios do AGENTS.md em qualquer proposição.
  tasks:
    - OBRIGATÓRIO estar escrito em português brasileiro (PT-BR).
    - Seguir a arquitetura Library-First, TDD com espelhamento 1:1, testes orientados a comportamento e Fakes determinísticos conforme AGENTS.md.
  design:
    - OBRIGATÓRIO estar escrito em português brasileiro (PT-BR).

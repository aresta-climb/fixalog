protocolo:
  nome: "Abertura de Via"
  descricao: "Registro técnico pericial de conquista ou abertura de novas rotas de escalada e proteções fixas instaladas."
blocos:
  route:
    titulo: "Bloco 1 — Identificação da Nova Via"
    subtitulo: "Dados técnicos de localização, conquistadores e linha da nova rota"
  actions:
    titulo: "Bloco 2 — Proteções e Ações da Conquista"
    subtitulo: "Registre cada proteção fixa, parada ou limpeza realizada na abertura. Mínimo 1."
  assessment:
    titulo: "Bloco 3 — Avaliação e Encerramento"
    subtitulo: "Condição da via e equipamento necessário para repetição"
conteudos:
  route_notice:
    titulo: "Identificação da Conquista"
    corpo: "Preencha os dados da nova via, coordenadas GPS da base e registre a imagem da linha/croqui do setor."
  route_date:
    label: "Data da Abertura / Conquista"
    sublabel: "Preenchida automaticamente com a data atual (editável)"
  route_gps:
    label: "Localização GPS da Base"
    sublabel: "Capture as coordenadas geográficas exatas da base da via"
  route_name:
    label: "Nome da Via"
    sublabel: "Nome dado à via pelo(s) conquistador(es)"
  route_first_ascensionists:
    label: "Conquistador(es)"
    sublabel: "Nomes dos conquistadores participantes"
  route_grade:
    label: "Graduação Estimada"
    sublabel: "Ex.: 6º sup D1 E2, 7b, V sup"
  route_length:
    label: "Extensão / Enfiadas"
    sublabel: "Ex.: 25m (esportiva) ou 150m / 4 enfiadas"
  route_sector:
    label: "Setor / Bloco"
  route_peak:
    label: "Pico / Área"
  route_line_media:
    label: "Mídia do Setor / Linha da Via"
    sublabel: "Anexe foto, vídeo ou PDF mostrando a linha da via ou croqui"
  ia_position:
    label: "Posição / Identificação da Proteção"
    sublabel: "Ex.: 1ª proteção, Enfiada 2 - 4ª chapeleta"
  ref_mat_protection:
    label: "Materiais utilizados"
    sublabel: "Selecione os materiais do catálogo instalados neste ponto ou cadastre um novo"
  ia_media:
    label: "Mídia após instalação"
  ia_notes:
    label: "Observações (opcional)"
  ba_position:
    label: "Identificação da Parada"
    sublabel: "Ex.: Parada P1, Parada Final"
  ref_mat_belay:
    label: "Materiais utilizados na parada"
    sublabel: "Selecione os materiais do catálogo instalados nesta parada ou cadastre um novo"
  ba_media:
    label: "Mídia após instalação"
  ba_notes:
    label: "Observações (opcional)"
  lr_notice:
    titulo: "ATENÇÃO — Zona de Risco"
    corpo: "A remoção de blocos deve ser feita com a base isolada e sem presença de pessoas abaixo."
  lr_size:
    label: "Tamanho aproximado do bloco"
    opcoes:
      small:
        label: "Pequeno (tamanho de punho)"
      medium:
        label: "Médio (tamanho de melancia)"
      large:
        label: "Grande (maior que melancia)"
  lr_media_before:
    label: "Mídia antes da remoção"
  lr_media_after:
    label: "Mídia após remoção"
  vc_media_before:
    label: "Mídia antes da limpeza"
  vc_notes:
    label: "Descrição da limpeza"
  vc_media_after:
    label: "Mídia após limpeza"
  oth_description:
    label: "Descrição da ação realizada"
  ref_mat_other:
    label: "Materiais utilizados (opcional)"
    sublabel: "Caso esta ação tenha utilizado materiais do catálogo, selecione-os abaixo"
  oth_media:
    label: "Mídia (opcional)"
  action_list_c:
    label: "Proteções e Ações Realizadas"
    sublabel: "Adicione cada proteção fixa instalada, parada ou intervenção na rocha. Mínimo 1."
  assessment_condition:
    label: "Condição atual da via"
    opcoes:
      open:
        label: "Liberada para escalada"
        sublabel: "Conquista concluída e pronta para repetições"
      project_in_progress:
        label: "Em conquista / Projeto em aberto"
        sublabel: "Via ainda não finalizada"
      open_with_restrictions:
        label: "Liberada com restrição"
        sublabel: "Verificar recomendações antes de repetir"
  assessment_comments:
    label: "Equipamento sugerido para repetição e comentários (opcional)"
    sublabel: "Ex.: 12 costuras, jogo de friends #0.5 a #2, corda de 60m"
tipos_acao:
  installed_protection:
    label: "Proteção Fixa Instalada"
    sublabel: "Instalação de chapeleta, parabolt, grampo ou ancoragem química"
  belay_rappel_station:
    label: "Parada / Rapel Instalado"
    sublabel: "Instalação de parada dupla/tripla ou estação de rapel"
  loose_rock_removal:
    label: "Remoção de Bloco Solto"
    sublabel: "Retirada de pedra ou laca instável durante a abertura"
  vegetation_cleaning:
    label: "Limpeza de Vegetação"
    sublabel: "Limpeza de agarras ou canaletas na linha da conquista"
  other:
    label: "Outra Ação"
    sublabel: "Ação ou registro adicional da abertura"
opcoes:
  small:
    label: "Pequeno (tamanho de punho)"
  medium:
    label: "Médio (tamanho de melancia)"
  large:
    label: "Grande (maior que melancia)"
  open:
    label: "Liberada para escalada"
    sublabel: "Conquista concluída e pronta para repetições"
  project_in_progress:
    label: "Em conquista / Projeto em aberto"
    sublabel: "Via ainda não finalizada"
  open_with_restrictions:
    label: "Liberada com restrição"
    sublabel: "Verificar recomendações antes de repetir"

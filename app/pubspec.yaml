name: fixlog
description: "Aplicativo de inventário e vistoria técnica de proteções em vias de escalada."
publish_to: 'none'
version: 0.1.1-dev+3

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.7
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  pointycastle: ^4.0.0
  printing: ^5.14.3
  protobuf: ^6.0.0
  yaml: ^3.1.2
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  xml: ^7.0.1
  basic_utils: ^5.8.2
  path: ^1.9.0
  uuid: ^4.3.0
  local_auth: ^3.0.1
  flutter_image_compress: ^2.4.0
  rust_lib_app:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

  meta: any
  shared_preferences: ^2.5.5
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  ffmpeg_kit_flutter_new: ^4.3.2
  share_plus: ^13.2.0
  open_filex: ^4.7.0
  signature: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

  geolocator_platform_interface: any
  plugin_platform_interface: any
  isar_community_generator: ^3.3.2
flutter:
  uses-material-design: true

  assets:
    - assets/protocols/
    - assets/logo_app.png
    - assets/logo_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "#121416"
  adaptive_icon_foreground: "assets/logo_app.png"

flutter_native_splash:
  color: "#121416"
  image: "assets/logo_splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/logo_splash.png"
    icon_background_color: "#121416"

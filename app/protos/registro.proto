// registro.proto
//
// Schema de SAÍDA — o registro gerado pelo mantenedor.
//
// Este schema adota um modelo HÍBRIDO: 
// 1. O ENVELOPE (segurança, mídias, assinaturas) é estritamente tipado.
// 2. O PAYLOAD (dados do formulário) é dinâmico e guiado pelo YAML.
//
// A ESTRUTURA DO FORMULÁRIO é descrita em wizard.proto.

syntax = "proto3";
package fixalog;

// ══════════════════════════════════════════════════════════════
// MÍDIAS E METADADOS
// ══════════════════════════════════════════════════════════════

// Representa um arquivo de imagem armazenado isoladamente no diretório da sessão.
// Esta estrutura guarda metadados essenciais de segurança para a auditoria criptográfica.
message ArquivoImagem {
  string uuid = 1;              // Identificador único correspondente ao nome do arquivo
  string tipo_original = 2;     // MIME type do arquivo cru (ex: image/jpeg)
  string hash_original = 3;     // SHA-256 do arquivo original para checagem de adulteração
  string tipo_comprimido = 4;   // MIME type do arquivo pós-compressão WebP
  string hash_comprimido = 5;   // SHA-256 do arquivo comprimido
  int32  versao_compressao = 6; // Versão do algoritmo de compressão (ex: 1)
}

// Representa um arquivo de vídeo armazenado isoladamente.
// Permite compressões em H.264/H.265 para PDF mantendo o rastro criptográfico.
message ArquivoVideo {
  string uuid = 1;              // Identificador único (nome do .mp4)
  string tipo_original = 2;     // MIME type original capturado
  string hash_original = 3;     // SHA-256 do arquivo original
  string tipo_comprimido = 4;   // MIME type do vídeo após otimização
  string hash_comprimido = 5;   // SHA-256 do vídeo comprimido
  int32  versao_compressao = 6; // Versão do algoritmo de ffmpeg/compressão (ex: 1)
}

// Representa um arquivo de áudio (mensagens de voz ou laudos falados).
message ArquivoAudio {
  string uuid = 1;              // Identificador único (nome do arquivo de áudio)
  string tipo_original = 2;     // MIME type original capturado pelo microfone (ex: audio/mp4 ou audio/aac)
  string hash_original = 3;     // SHA-256 do áudio original para auditoria
  string tipo_comprimido = 4;   // MIME type do áudio após compressão/conversão
  string hash_comprimido = 5;   // SHA-256 do áudio comprimido
  int32  versao_compressao = 6; // Versão do algoritmo de compressão de áudio
}

// Um contêiner polimórfico (`oneof`) que aponta para qualquer tipo de mídia no disco local.
// Substitui a inclusão direta de bytes no Protobuf, delegando a mídia para o SessionBundleManager.
message ReferenciaMidia {
  oneof midia {
    ArquivoImagem imagem = 1;
    ArquivoVideo  video  = 2;
    ArquivoAudio  audio  = 3;
  }
}

// ══════════════════════════════════════════════════════════════
// PAYLOAD DINÂMICO
// ══════════════════════════════════════════════════════════════

// Wrapper para permitir listas de respostas dentro do oneof (ex: checkboxes, seleções múltiplas)
message ListaRespostas {
  repeated Resposta valores = 1;
}

// Tipo de dado dinâmico para os campos do formulário
message Resposta {
  oneof valor {
    string texto = 1;
    double numero = 2;
    int64 inteiro = 3;
    bool booleano = 4;
    ReferenciaMidia midia = 5;
    ListaRespostas lista = 6;
  }
}

// Representa um item gerado dinamicamente dentro de uma ListaAcoes ou similar no YAML
message GrupoRepetido {
  string id_lista = 1; // ID do ConteudoStep do tipo lista (ex: "lista_acoes_c")
  string id_item = 2;  // UUID único do item da lista
  string id_tipo = 3;  // ID do TipoAcao correspondente ao item escolhido
  map<string, Resposta> respostas_item = 4; // Respostas contidas dentro deste item específico
}

// ══════════════════════════════════════════════════════════════
// REGISTRO UNIFICADO
// ══════════════════════════════════════════════════════════════

message Registro {
  // --- ENVELOPE ESTRITO DE SEGURANÇA E CONTEXTO ---
  string id_sessao            = 1;  // UUID gerado no início da sessão
  string id_protocolo         = 2;  // ID do YAML (ex: "expresso", "manutencao")
  string versao_protocolo     = 3;  // Hash ou versão do YAML no momento
  int64  utc_timestamp_inicio = 4;  // timestamp de início (segundos)
  int64  utc_timestamp_fim    = 5;  // timestamp de conclusão
  
  bytes assinatura_visual   = 6;  // PNG do canvas de assinatura
  bytes assinatura_digital  = 7;  // JWS do hash do registro completo
  string id_mantenedor      = 8;  // hash da chave pública do mantenedor
  string attestation_token  = 9;  // Futuro uso com Play Integrity / App Attest

  // --- PAYLOAD DINÂMICO ---
  // Respostas planas e campos simples do fluxo principal. A chave é o ID definido no YAML.
  map<string, Resposta> respostas = 10;

  // Listas de itens criados dinamicamente no formulário (Blocos que podem repetir infinitamente).
  repeated GrupoRepetido listas = 11;
  
  // Conteúdo raw do YAML usado para gerar este registro (garante recriação perfeita do layout original)
  string yaml_conteudo = 12;
}
